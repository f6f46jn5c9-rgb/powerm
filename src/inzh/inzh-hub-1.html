<!-- HTML-МАКРОС 1: СТРАНИЦА ЦЕЛИКОМ (hero + плашки) -->
<style>
.inzh-hub-root{display:block;box-sizing:border-box;width:100%;max-width:100%;margin:0 0 24px !important;padding:0 !important;container-type:inline-size;container-name:inzhhubroot;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4;color:#1F2A33;text-align:left;word-break:normal;overflow-wrap:normal;-webkit-hyphens:manual;hyphens:manual}
.inzh-hub-root *,.inzh-hub-root *::before,.inzh-hub-root *::after{box-sizing:border-box}
.inzh-hub-root .inzh-hub-hero{display:block;margin:0 !important;padding:20px 0 16px !important;border:0 !important;background:#ffffff !important}
.inzh-hub-root .inzh-hub-crumb{display:block;margin:0 0 12px !important;padding:0 !important;border:0 !important;background:none !important;font-size:13px !important;line-height:1.3 !important;color:#546e7a !important;font-family:inherit !important;text-decoration:none !important}
.inzh-hub-root .inzh-hub-crumb a{margin:0 !important;padding:2px 0 !important;border:0 !important;background:none !important;font-size:13px !important;font-weight:400 !important;line-height:1.3 !important;color:#546e7a !important;font-family:inherit !important;text-decoration:none !important;border-radius:3px}
.inzh-hub-root .inzh-hub-crumb a:visited{color:#546e7a !important}
.inzh-hub-root .inzh-hub-crumb a:hover{text-decoration:underline !important}
.inzh-hub-root .inzh-hub-crumb a:focus-visible{outline:3px solid #546e7a;outline-offset:3px}
.inzh-hub-root .inzh-hub-row{display:flex;align-items:center;gap:16px;margin:0 !important;padding:0 !important}
.inzh-hub-root .inzh-hub-ico{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:#546e7a;color:#fff}
.inzh-hub-root .inzh-hub-ico svg{display:block;max-width:none;fill:#fff}
.inzh-hub-root h1.inzh-hub-title{flex:1 1 auto;min-width:0;display:block;margin:0 !important;padding:0 !important;border:0 !important;background:none !important;font-size:26px !important;font-weight:800 !important;line-height:1.2 !important;color:#546e7a !important;font-family:inherit !important;letter-spacing:0 !important;text-transform:none !important;text-decoration:none !important;text-align:left !important;word-break:normal !important;overflow-wrap:normal !important;text-wrap:balance}
.inzh-hub-root .inzh-hub-line{display:block;height:3px;margin:0 !important;padding:0 !important;background:linear-gradient(90deg,#546e7a,transparent)}
.inzh-hub-root .inzh-hub-tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin:0 !important;padding:20px 0 0 !important;border:0 !important;background:none !important}
.inzh-hub-root a.inzh-hub-tile{position:relative !important;isolation:isolate;display:flex !important;flex-direction:column;justify-content:space-between;gap:14px;grid-column:span 2;min-width:0;min-height:110px;margin:0 !important;padding:16px !important;border:0 !important;background:none !important;border-radius:16px !important;cursor:pointer;box-shadow:0 10px 26px rgba(36,48,56,.30),0 2px 6px rgba(10,12,13,.12);color:#fff !important;font-size:15px !important;font-weight:600 !important;line-height:1.3 !important;font-family:inherit !important;letter-spacing:0 !important;text-transform:none !important;text-decoration:none !important;text-align:left !important;transition:transform .25s ease,box-shadow .25s ease}
.inzh-hub-root a.inzh-hub-tile:nth-child(4){grid-column:1 / span 3}
.inzh-hub-root a.inzh-hub-tile:nth-child(5){grid-column:4 / span 3}
.inzh-hub-root a.inzh-hub-tile:visited{color:#fff !important}
.inzh-hub-root .inzh-hub-fx{position:absolute;z-index:0;inset:0;display:block;overflow:hidden;margin:0 !important;padding:0 !important;border:0 !important;border-radius:inherit;pointer-events:none;background:radial-gradient(ellipse 55% 50% at 78% 18%,rgba(176,196,210,0.80) 0%,transparent 65%),radial-gradient(ellipse 35% 35% at 14% 82%,rgba(84,110,122,0.45) 0%,transparent 65%),linear-gradient(140deg,#0a0c0d 0%,#151d20 40%,#243038 72%,#546e7a 100%) !important}
.inzh-hub-root .inzh-hub-glass{position:absolute;z-index:1;inset:0;display:block;overflow:hidden;margin:0 !important;padding:0 !important;border-radius:inherit;pointer-events:none;background:linear-gradient(0deg,rgba(5,10,14,.88) 0,rgba(5,10,14,.5) 48%,rgba(5,10,14,0) 90%),linear-gradient(rgba(255,255,255,.08),rgba(255,255,255,.08)) !important;-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);border:1px solid rgba(255,255,255,.45) !important;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 26px rgba(255,255,255,.14);transition:border-color .25s ease}
.inzh-hub-root .inzh-hub-glass::before{content:"";position:absolute;inset:-14px;background:linear-gradient(135deg,rgba(255,255,255,.3) 0,rgba(255,255,255,0) 42%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.inzh-hub-root .inzh-hub-glass{background:linear-gradient(0deg,rgba(5,10,14,.88) 0,rgba(5,10,14,.5) 48%,rgba(5,10,14,0) 90%),linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,.16)) !important}}
.inzh-hub-root a.inzh-hub-tile:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.3);text-decoration:none !important}
.inzh-hub-root a.inzh-hub-tile:hover .inzh-hub-glass{border-color:rgba(255,255,255,.85) !important}
.inzh-hub-root a.inzh-hub-tile:hover .inzh-hub-arrow{transform:translateX(4px);opacity:1}
.inzh-hub-root a.inzh-hub-tile:focus-visible{outline:3px solid #546e7a;outline-offset:3px}
.inzh-hub-root .inzh-hub-top{position:relative;z-index:2;display:flex;justify-content:flex-end;margin:0 !important;padding:0 !important;border:0 !important;background:none !important}
.inzh-hub-root .inzh-hub-arrow{display:block;width:22px;height:22px;opacity:.9;transition:transform .25s ease,opacity .25s ease}
.inzh-hub-root .inzh-hub-name{position:relative;z-index:2;display:block !important;margin:0 !important;padding:0 !important;border:0 !important;background:none !important;font-size:15px !important;font-weight:700 !important;line-height:1.2 !important;color:#fff !important;font-family:inherit !important;letter-spacing:0 !important;text-transform:none !important;text-decoration:none !important;text-align:left !important;text-shadow:0 1px 2px rgba(0,0,0,.3)}
@container inzhhubroot (max-width:599px){.inzh-hub-root .inzh-hub-tiles{grid-template-columns:minmax(0,1fr);gap:10px}.inzh-hub-root a.inzh-hub-tile,.inzh-hub-root a.inzh-hub-tile:nth-child(4),.inzh-hub-root a.inzh-hub-tile:nth-child(5){grid-column:auto}.inzh-hub-root h1.inzh-hub-title{font-size:22px !important}.inzh-hub-root .inzh-hub-ico{width:48px;height:48px}}
@media (prefers-reduced-motion:reduce){.inzh-hub-root,.inzh-hub-root *{transition:none !important;animation:none !important}.inzh-hub-root a.inzh-hub-tile:hover,.inzh-hub-root a.inzh-hub-tile:hover .inzh-hub-arrow{transform:none}}
</style>
