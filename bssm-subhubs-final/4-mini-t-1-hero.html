<!-- HTML-МАКРОС 1: HERO (Тип Б, синий) -->
<style>
.mini-t-hub{display:block;box-sizing:border-box;width:100%;max-width:100%;margin:0 0 16px !important;padding:0 !important;container-type:inline-size;container-name:mini-t-hub;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4;text-align:left;word-break:normal;overflow-wrap:normal;-webkit-hyphens:manual;hyphens:manual}
.mini-t-hub *,.mini-t-hub *::before,.mini-t-hub *::after{box-sizing:border-box}
.mini-t-hub .mini-t-hero{display:flex;flex-direction:column;justify-content:flex-start;min-height:160px;margin:0 !important;padding:24px 32px 28px !important;border:0 !important;border-radius:12px;background:radial-gradient(ellipse 55% 50% at 78% 18%,rgba(100,180,255,0.88) 0%,transparent 65%),radial-gradient(ellipse 35% 35% at 14% 82%,rgba(42,92,168,0.52) 0%,transparent 65%),linear-gradient(140deg,#040810 0%,#08102a 40%,#152048 72%,#2a5ca8 100%) !important;color:#fff !important}
.mini-t-hub .mini-t-crumb{display:block;margin:0 !important;padding:0 !important;border:0 !important;background:none !important;font-size:13px !important;font-weight:400 !important;line-height:1.3 !important;color:rgba(255,255,255,0.65) !important;font-family:inherit !important;letter-spacing:0 !important;text-transform:none !important;text-decoration:none !important;font-style:normal !important;text-align:left !important}
.mini-t-hub .mini-t-crumb a,.mini-t-hub .mini-t-crumb a:visited{margin:0 !important;padding:2px 0 !important;border:0 !important;background:none !important;font-size:13px !important;font-weight:400 !important;line-height:1.3 !important;color:rgba(255,255,255,0.65) !important;font-family:inherit !important;letter-spacing:0 !important;text-transform:none !important;text-decoration:none !important;font-style:normal !important;border-radius:3px}
.mini-t-hub .mini-t-crumb a:hover{text-decoration:underline !important}
.mini-t-hub .mini-t-crumb a:focus-visible{outline:3px solid #fff;outline-offset:3px}
.mini-t-hub .mini-t-crumb .mini-t-crumb__off{margin:0 !important;padding:2px 0 !important;color:rgba(255,255,255,0.65) !important}
.mini-t-hub h1.mini-t-title{display:block;margin:10px 0 0 !important;padding:0 !important;border:0 !important;background:none !important;font-size:22px !important;font-weight:700 !important;line-height:1.25 !important;color:#fff !important;font-family:inherit !important;letter-spacing:0 !important;text-transform:none !important;text-decoration:none !important;font-style:normal !important;text-align:left !important;word-break:normal !important;overflow-wrap:normal !important}
@container mini-t-hub (max-width:559px){.mini-t-hub .mini-t-hero{padding:20px 16px 24px !important}}
@supports not (container-type:inline-size){@media (max-width:559px){.mini-t-hub .mini-t-hero{padding:20px 16px 24px !important}}}
@media (prefers-reduced-motion:reduce){.mini-t-hub *{animation:none !important;transition:none !important}}
</style>
<div class="mini-t-hub">
  <div class="mini-t-hero">
    <div class="mini-t-crumb">&larr; <a href="https://kb.severstal.com/spaces/BSS/pages/161546386/" aria-label="Назад в БУП">БУП</a></div>
    <h1 class="mini-t-title">БССМ. Программа &quot;Мини-Т&quot;</h1>
  </div>
</div>
<script>
(function () {
  var links = document.querySelectorAll('.mini-t-hub .mini-t-crumb a');
  for (var i = 0; i < links.length; i++) {
    var a = links[i], h = a.getAttribute('href') || '';
    if (h === '' || h.indexOf('URL_') === 0) {
      var s = document.createElement('span');
      s.className = 'mini-t-crumb__off';
      s.textContent = a.textContent;
      a.parentNode.replaceChild(s, a);
    }
  }
})();
</script>
