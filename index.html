<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог сервисов — Силовые машины</title>
<style>
  :root{
    --pm-navy-dark:#1a2a5e;
    --pm-navy-blue:#2b4fa8;
    --pm-teal:#0e7c7b;
    --pm-teal-dark:#0a5f5e;
    --pm-teal-light:#e6f4f3;
    --pm-red-accent:#e63329;
    --pm-text-dark:#1a1a2e;
    --pm-bg-page:#f2f1ed;
    --pm-white:#ffffff;
    --pm-muted:#6b7280;
    --pm-border:#e7e9f0;
    --radius:16px;
    --shadow-sm:0 1px 3px rgba(26,42,94,.08), 0 1px 2px rgba(26,42,94,.06);
    --shadow-md:0 8px 24px rgba(26,42,94,.12);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:"Inter","Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--pm-bg-page);
    color:var(--pm-text-dark);
    font-size:16px;
    line-height:1.55;
  }

  a{color:inherit;text-decoration:none;}

  .wrap{
    max-width:1280px;
    margin:0 auto;
    padding:28px 32px 80px;
  }

  /* ---------- Header ---------- */
  header.top-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:32px;
  }
  .brand-block .brand-name{
    font-size:13px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--pm-teal-dark);
    margin-bottom:6px;
  }
  .brand-block h1{
    font-size:28px;
    font-weight:700;
    margin:0 0 6px;
    color:var(--pm-navy-dark);
  }
  .brand-block .subtitle{
    color:var(--pm-muted);
    font-size:15px;
    margin:0;
  }

  .header-right{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--pm-white);
    border-radius:999px;
    padding:11px 18px;
    box-shadow:var(--shadow-sm);
    min-width:280px;
    border:1px solid transparent;
    transition:box-shadow .2s ease, border-color .2s ease;
  }
  .search-box:focus-within{
    border-color:var(--pm-teal);
    box-shadow:var(--shadow-md);
  }
  .search-box svg{color:var(--pm-muted); flex-shrink:0;}
  .search-box input{
    border:none;
    outline:none;
    font-size:15px;
    font-family:inherit;
    color:var(--pm-text-dark);
    width:100%;
    background:transparent;
  }
  .search-box input::placeholder{color:#9aa1ad;}

  /* ---------- Section headings ---------- */
  section.block{margin-bottom:40px;}
  .block-title{
    font-size:22px;
    font-weight:700;
    color:var(--pm-navy-dark);
    margin:0 0 18px;
  }

  /* ---------- Accent trigger buttons + dropdowns ---------- */
  .trigger-wrap{
    position:relative;
  }
  .accent-trigger{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:inherit;
    font-size:14.5px;
    font-weight:700;
    color:#fff;
    background:linear-gradient(135deg, var(--pm-navy-dark), var(--pm-teal));
    border:none;
    border-radius:999px;
    padding:12px 20px;
    cursor:pointer;
    box-shadow:var(--shadow-sm), 0 0 40px rgba(14,124,123,.25);
    transition:box-shadow .25s ease, transform .2s ease;
  }
  .accent-trigger:hover, .trigger-wrap.open .accent-trigger{
    transform:translateY(-2px);
    box-shadow:var(--shadow-md), 0 0 55px rgba(14,124,123,.4);
  }
  .trigger-chev{
    transition:transform .25s ease;
    flex-shrink:0;
  }
  .trigger-wrap:hover .trigger-chev,
  .trigger-wrap.open .trigger-chev{
    transform:rotate(180deg);
  }

  .dropdown-panel{
    position:absolute;
    top:calc(100% + 10px);
    left:0;
    min-width:340px;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.3);
    border-radius:var(--radius);
    box-shadow:var(--shadow-md);
    padding:18px;
    opacity:0;
    visibility:hidden;
    transform:translateY(-6px);
    transition:opacity .2s ease, transform .2s ease, visibility .2s;
    pointer-events:none;
    z-index:50;
  }
  .trigger-wrap:hover .dropdown-panel,
  .trigger-wrap.open .dropdown-panel{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
    pointer-events:auto;
  }
  .dropdown-title{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--pm-muted);
    margin-bottom:12px;
  }
  .dropdown-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .dropdown-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:4px 14px;
  }
  .dropdown-link{
    display:block;
    font-size:14.5px;
    color:var(--pm-text-dark);
    padding:8px 10px;
    border-radius:8px;
    transition:background .15s ease, color .15s ease;
  }
  .dropdown-link:hover{
    background:var(--pm-teal-light);
    color:var(--pm-teal-dark);
  }
  #frequentDropdown{
    left:auto;
    right:0;
  }

  /* ---------- Catalog / Accordion ---------- */
  .catalog-hint{
    color:var(--pm-muted);
    font-size:14px;
    margin:-10px 0 18px;
  }
  .accordion{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .accordion-section{
    background:var(--pm-white);
    border-radius:var(--radius);
    box-shadow:var(--shadow-sm);
    overflow:hidden;
  }
  .accordion-header{
    display:flex;
    align-items:center;
    gap:16px;
    padding:18px 22px;
    cursor:pointer;
    user-select:none;
    background:var(--pm-white);
    border:none;
    width:100%;
    text-align:left;
    font-family:inherit;
  }
  .accordion-header:focus-visible{
    outline:2px solid var(--pm-teal);
    outline-offset:-2px;
  }
  .section-icon{
    width:42px;height:42px;
    border-radius:12px;
    background:var(--pm-teal-light);
    color:var(--pm-teal);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .accordion-header h3{
    font-size:16.5px;
    font-weight:700;
    margin:0;
    color:var(--pm-text-dark);
    flex-grow:1;
  }
  .chev{
    color:var(--pm-muted);
    transition:transform .25s ease;
    flex-shrink:0;
  }
  .accordion-section.open .chev{transform:rotate(180deg);}

  .accordion-panel{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
  }
  .accordion-panel-inner{
    background:#eceae4;
    padding:22px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
  }
  .group-title{
    font-weight:700;
    font-size:15px;
    color:var(--pm-muted);
    margin:0 0 10px;
  }
  .service-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .service-item a{
    font-size:14.5px;
    color:var(--pm-text-dark);
    display:inline-block;
    padding:2px 0;
    border-bottom:1px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .service-item a:hover{
    color:var(--pm-teal-dark);
    border-bottom-color:var(--pm-teal);
  }

  .frequent-group{
    grid-column:1 / -1;
    background:rgba(230,244,243,.45);
    border-radius:12px;
    padding:16px 18px;
  }
  .frequent-label{
    display:flex;
    align-items:center;
    gap:6px;
    text-transform:uppercase;
    letter-spacing:.05em;
    font-size:11px;
    font-weight:700;
    color:var(--pm-teal);
    margin-bottom:10px;
  }
  .frequent-label svg{flex-shrink:0;}
  .frequent-group .service-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:6px 20px;
  }

  /* ---------- Tooltip ---------- */
  #tooltip{
    position:fixed;
    z-index:1000;
    background:var(--pm-navy-dark);
    color:#fff;
    font-size:13px;
    padding:8px 14px;
    border-radius:8px;
    box-shadow:var(--shadow-md);
    pointer-events:none;
    opacity:0;
    transform:translate(-50%,-8px);
    transition:opacity .15s ease, transform .15s ease;
    white-space:nowrap;
  }
  #tooltip.show{opacity:1; transform:translate(-50%,-16px);}

  /* ---------- Responsive ---------- */
  @media (max-width:980px){
    .accordion-panel-inner{grid-template-columns:1fr;}
    .frequent-group .service-list{grid-template-columns:1fr;}
  }
  @media (max-width:640px){
    .wrap{padding:20px 16px 60px;}
    .header-right{width:100%;}
    .search-box{min-width:0; flex-grow:1; width:100%;}
    .trigger-wrap{width:100%;}
    .accent-trigger{width:100%; justify-content:center;}
    .dropdown-panel{min-width:0; width:100%; left:0; right:0;}
    .dropdown-grid{grid-template-columns:1fr;}
    .brand-block h1{font-size:24px;}
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="top-header">
    <div class="brand-block">
      <div class="brand-name">Силовые машины</div>
      <h1>Каталог сервисов</h1>
      <p class="subtitle">Все внутренние сервисы компании — в одном окне</p>
    </div>
    <div class="header-right">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="globalSearch" type="text" placeholder="Поиск по каталогу сервисов…">
      </div>

      <div class="trigger-wrap">

          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="17" y1="11" x2="23" y2="11"/></svg>
          Новичку — с чего начать
          <svg class="trigger-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="dropdown-panel" id="newbieDropdown">
          <div class="dropdown-title">Первые шаги в компании</div>
          <ul class="dropdown-list" id="newbieList"></ul>
        </div>
      </div>

      <div class="trigger-wrap">
        <button class="accent-trigger" id="frequentTrigger" aria-haspopup="true" aria-expanded="false">
          ⚡ Часто ищут
          <svg class="trigger-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="dropdown-panel" id="frequentDropdown">
          <div class="dropdown-title">Популярные сервисы</div>
          <div class="dropdown-grid" id="frequentGrid"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- Catalog accordion -->
  <section class="block">
    <h2 class="block-title">Полный каталог сервисов</h2>
    <p class="catalog-hint">Ищите по названию сервиса в строке поиска вверху страницы — подходящие разделы раскроются автоматически.</p>
    <div class="accordion" id="catalogAccordion"></div>
  </section>

</div>

<div id="tooltip">Ссылка появится позже</div>

<script>
(function(){
  "use strict";

  const ICONS = {

    trend:'<polyline points="3 17 9 11 13 15 21 5"/><polyline points="14 5 21 5 21 12"/>'
  };

  function svg(key, w){
    w = w || 22;
    return '<svg width="'+w+'" height="'+w+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONS[key]+'</svg>';
  }

  // ---------- Frequent services (shown inside catalog sections + "Часто ищут" dropdown) ----------

  const FREQUENT_SERVICES = [

    'Оформить командировку'
  ];
  const FREQUENT_SET = new Set(FREQUENT_SERVICES);

  const frequentGrid = document.getElementById('frequentGrid');
  frequentGrid.innerHTML = FREQUENT_SERVICES.map(name =>
    '<a class="dropdown-link" href="#">'+name+'</a>'
  ).join('');

  // ---------- Newbie quick links ----------
  const NEWBIE_SERVICES = [
    'Мой личный кабинет',
    'Подписать кадровый документ (КЭДО)',
    'Электронная трудовая книжка',
    'Пропуск (получить/восстановить)',
    'Почта Outlook',
    'Структура компании'
  ];
  const newbieList = document.getElementById('newbieList');
  newbieList.innerHTML = NEWBIE_SERVICES.map(name =>
    '<li><a class="dropdown-link" href="#">'+name+'</a></li>'
  ).join('');

  // ---------- Trigger dropdowns (hover on desktop, click/tap on mobile) ----------
  document.querySelectorAll('.trigger-wrap > .accent-trigger').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wrap = btn.closest('.trigger-wrap');
      const isOpen = wrap.classList.contains('open');
      document.querySelectorAll('.trigger-wrap.open').forEach(w => {
        w.classList.remove('open');
        w.querySelector('.accent-trigger').setAttribute('aria-expanded','false');
      });
      if (!isOpen){
        wrap.classList.add('open');
        btn.setAttribute('aria-expanded','true');
      }
    });
  });
  document.addEventListener('click', () => {
    document.querySelectorAll('.trigger-wrap.open').forEach(w => {
      w.classList.remove('open');
      w.querySelector('.accent-trigger').setAttribute('aria-expanded','false');
    });
  });

    { id:'edu', icon:'bookopen', title:'Обучение и развитие', groups:[
      {title:'Учебные платформы', items:['ЭнергоАкадемия (курсы и тесты)','Обучение и развитие','Записи вебинаров','Изучение иностранных языков','Повышение квалификации']},
      {title:'Знания и библиотеки', items:['База знаний и Нейрон','Электронная библиотека','База знаний бизнес-системы']},
      {title:'Оценка и карьера', items:['Аттестация','Диалог о целях','Кадровый резерв','Кадровый комитет','Конкурс Н.А.С. и аспирантура','Конкурс «Прорыв года»']},
      {title:'Профессиональные сообщества', items:['Лекторий','Инженерный клуб','Центры экспертиз']}
    ]},
    { id:'prod', icon:'factory', title:'Производство, качество, охрана труда', groups:[
      {title:'Производственные системы', items:['АРМ','Журнал производственного контроля','САПР КТИ','Система КТПП','ИС Метрология','СТО и МОЗ','Продажа неликвидов']},
      {title:'Качество', items:['Вопросы качества на ПРП','Дашборд качества','Портал качества','Документация по качеству','Аудиты качества']},
      {title:'Охрана труда и промбезопасность', items:['Охрана труда (главная)','СИЗ','Работы на высоте','Приложение СИЗ','Молнии','Видеоматериалы по ОТ','Документы по ОТ','Программа «Опора»']},
      {title:'Бизнес-система (ЦРБС)', items:['Инструменты БС','Аудиты БС','Ключевые проекты БС']}
    ]},
    { id:'health', icon:'heart', title:'Здоровье и благополучие', groups:[
      {title:'Медицина и ДМС', items:['ДМС для сотрудника','ДМС для близких','МСЧ','Фонд медицинской поддержки','Диспансеризация','Санаторно-курортное лечение','Донорство']},
      {title:'Питание', items:['Столовые и меню']},
      {title:'Отдых и спорт', items:['Отдых и путёвки','Детский отдых','Энергия спорта']},
      {title:'Льготы и поддержка', items:['Best Benefits','Волонтёрство и благотворительность']}
    ]},
    { id:'life', icon:'star', title:'Жизнь компании', groups:[
      {title:'Новости и медиа', items:['Новости компании','Telegram/MAX/ВК/YouTube','Энергопульс','Дайджест ИТ','КВН']},
      {title:'События', items:['Мероприятия','Выставки и конференции','Дни рождения коллег','Поздравить партнёра']},
      {title:'Признание', items:['Награды и признание']},
      {title:'История и традиции', items:['Музеи ЛМЗ и Электросилы','Производственные экскурсии','Бессмертный полк']}
    ]},
    { id:'about', icon:'building', title:'О компании и правила', groups:[
      {title:'О компании', items:['О компании','Миссия/видение/ценности','Руководители и помощники','Реквизиты']},
      {title:'Справочник подразделений', items:['Структура компании','Справочник 24 подразделений','Вакансии','Приведи друга']},
      {title:'Политики и регламенты', items:['Стандарт поведения','ИБ: правила','Персональные данные','Личная безопасность','Новости законодательства','Алкотестеры','Нотариальные услуги','Интеллектуальная собственность','Регламенты закупок','Уничтожение документов','Канцелярия']}
    ]}
  ];

  const accordion = document.getElementById('catalogAccordion');
  accordion.innerHTML = catalogData.map((section, sIdx) => {
    const freqItems = [];
    section.groups.forEach(g => g.items.forEach(item => {
      if (FREQUENT_SET.has(item)) freqItems.push(item);
    }));

    const freqBlock = freqItems.length ?
      '<div class="group frequent-group">'+
        '<div class="frequent-label">'+svg('trend',13)+'Часто используют</div>'+
        '<ul class="service-list">'+
          freqItems.map(item =>
            '<li class="service-item" data-search="'+item.toLowerCase()+'"><a href="#">'+item+'</a></li>'
          ).join('')+
        '</ul>'+
      '</div>' : '';

    const groupsHtml = section.groups.map(g => {
      const items = g.items.filter(item => !FREQUENT_SET.has(item));
      if (!items.length) return '';
      return '<div class="group">'+
        '<div class="group-title">'+g.title+'</div>'+
        '<ul class="service-list">'+
          items.map(item =>
            '<li class="service-item" data-search="'+item.toLowerCase()+'"><a href="#">'+item+'</a></li>'
          ).join('')+
        '</ul>'+
      '</div>';
    }).join('');

    return '<div class="accordion-section" data-index="'+sIdx+'">'+
      '<button class="accordion-header" aria-expanded="false">'+
        '<div class="section-icon">'+svg(section.icon,20)+'</div>'+
        '<h3>'+section.title+'</h3>'+
        '<span class="chev">'+svg('chevron',18)+'</span>'+
      '</button>'+
      '<div class="accordion-panel">'+
        '<div class="accordion-panel-inner">'+
          freqBlock+groupsHtml+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');

  // ---------- Accordion toggle ----------
  const sections = Array.from(accordion.querySelectorAll('.accordion-section'));
  sections.forEach(sectionEl => {
    const header = sectionEl.querySelector('.accordion-header');
    const panel = sectionEl.querySelector('.accordion-panel');
    header.addEventListener('click', () => {
      const isOpen = sectionEl.classList.contains('open');
      if (isOpen){
        sectionEl.classList.remove('open');
        header.setAttribute('aria-expanded','false');
        panel.style.maxHeight = '0px';
      } else {
        sectionEl.classList.add('open');
        header.setAttribute('aria-expanded','true');
        panel.style.maxHeight = panel.scrollHeight + 'px';
      }
    });
  });

  // ---------- Live search filter ----------
  const searchInput = document.getElementById('globalSearch');
  searchInput.addEventListener('input', () => {
    const query = searchInput.value.trim().toLowerCase();
    const hasQuery = query.length > 0;

    sections.forEach(sectionEl => {
      let sectionHasMatch = false;
      sectionEl.querySelectorAll('.group').forEach(groupEl => {
        let groupHasMatch = false;
        groupEl.querySelectorAll('.service-item').forEach(itemEl => {
          const match = !hasQuery || itemEl.dataset.search.indexOf(query) !== -1;
          itemEl.style.display = match ? '' : 'none';
          if (match) groupHasMatch = true;
        });
        groupEl.style.display = groupHasMatch ? '' : 'none';
        if (groupHasMatch) sectionHasMatch = true;
      });

      sectionEl.style.display = sectionHasMatch ? '' : 'none';

      const header = sectionEl.querySelector('.accordion-header');
      const panel = sectionEl.querySelector('.accordion-panel');

      if (hasQuery && sectionHasMatch){
        sectionEl.classList.add('open');
        header.setAttribute('aria-expanded','true');
        panel.style.maxHeight = panel.scrollHeight + 'px';
      } else if (!hasQuery){
        sectionEl.classList.remove('open');
        header.setAttribute('aria-expanded','false');
        panel.style.maxHeight = '0px';
      } else {
        sectionEl.classList.remove('open');
        panel.style.maxHeight = '0px';
      }
    });
  });

  // ---------- Tooltip on placeholder links ----------
  const tooltip = document.getElementById('tooltip');
  let tooltipTimer = null;
  document.addEventListener('click', (e) => {
    const link = e.target.closest('a[href="#"]');
    if (!link) return;
    e.preventDefault();
    const rect = link.getBoundingClientRect();
    tooltip.style.left = (rect.left + rect.width/2) + 'px';
    tooltip.style.top = rect.top + 'px';
    tooltip.classList.add('show');
    clearTimeout(tooltipTimer);
    tooltipTimer = setTimeout(() => tooltip.classList.remove('show'), 1500);
  });

})();
</script>
</body>
</html>
