<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог сервисов — Силовые машины</title>
<style>
  :root{
    --pm-navy-dark:#1a2a5e;
    --pm-navy-blue:#2b4fa8;
    --pm-teal:#0e7c7b;
    --pm-teal-dark:#0a5f5e;
    --pm-teal-light:#e6f4f3;
    --pm-red-accent:#e63329;
    --pm-text-dark:#1a1a2e;
    --pm-bg-page:#f2f1ed;
    --pm-white:#ffffff;
    --pm-muted:#6b7280;
    --pm-border:#e7e9f0;
    --radius:16px;
    --shadow-sm:0 1px 3px rgba(26,42,94,.08), 0 1px 2px rgba(26,42,94,.06);
    --shadow-md:0 8px 24px rgba(26,42,94,.12);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:"Inter","Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--pm-bg-page);
    color:var(--pm-text-dark);
    font-size:16px;
    line-height:1.55;
  }

  a{color:inherit;text-decoration:none;}

  .wrap{
    max-width:1280px;
    margin:0 auto;
    padding:28px 32px 80px;
  }

  /* ---------- Header ---------- */
  header.top-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:32px;
  }
  .brand-block .brand-logo{
    display:block;
    height:36px;
    width:auto;
    margin-bottom:10px;
  }
  .brand-block h1{
    font-size:28px;
    font-weight:700;
    margin:0 0 6px;
    color:var(--pm-navy-dark);
  }
  .brand-block .subtitle{
    color:var(--pm-muted);
    font-size:15px;
    margin:0;
  }

  .header-right{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--pm-white);
    border-radius:999px;
    padding:11px 18px;
    box-shadow:var(--shadow-sm);
    min-width:280px;
    border:1px solid transparent;
    transition:box-shadow .2s ease, border-color .2s ease;
  }
  .search-box:focus-within{
    border-color:var(--pm-teal);
    box-shadow:var(--shadow-md);
  }
  .search-box svg{color:var(--pm-muted); flex-shrink:0;}
  .search-box input{
    border:none;
    outline:none;
    font-size:15px;
    font-family:inherit;
    color:var(--pm-text-dark);
    width:100%;
    background:transparent;
  }
  .search-box input::placeholder{color:#9aa1ad;}

  /* ---------- Section headings ---------- */
  section.block{margin-bottom:40px;}
  .block-title{
    font-size:22px;
    font-weight:700;
    color:var(--pm-navy-dark);
    margin:0 0 18px;
  }

  /* ---------- Accent trigger buttons + dropdowns ---------- */
  .trigger-wrap{
    position:relative;
  }
  .accent-trigger{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:inherit;
    font-size:14.5px;
    font-weight:700;
    color:#fff;
    background:linear-gradient(135deg, var(--pm-navy-dark), var(--pm-teal));
    border:none;
    border-radius:999px;
    padding:12px 20px;
    cursor:pointer;
    box-shadow:var(--shadow-sm), 0 0 40px rgba(14,124,123,.25);
    transition:box-shadow .25s ease, transform .2s ease;
  }
  .accent-trigger:hover, .trigger-wrap.open .accent-trigger{
    transform:translateY(-2px);
    box-shadow:var(--shadow-md), 0 0 55px rgba(14,124,123,.4);
  }
  .trigger-chev{
    transition:transform .25s ease;
    flex-shrink:0;
  }
  .trigger-wrap:hover .trigger-chev,
  .trigger-wrap.open .trigger-chev{
    transform:rotate(180deg);
  }

  .dropdown-panel{
    position:absolute;
    top:calc(100% + 10px);
    left:0;
    min-width:340px;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.3);
    border-radius:var(--radius);
    box-shadow:var(--shadow-md);
    padding:18px;
    opacity:0;
    visibility:hidden;
    transform:translateY(-6px);
    transition:opacity .2s ease, transform .2s ease, visibility .2s;
    pointer-events:none;
    z-index:50;
  }
  .trigger-wrap:hover .dropdown-panel,
  .trigger-wrap.open .dropdown-panel{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
    pointer-events:auto;
  }
  .dropdown-title{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--pm-muted);
    margin-bottom:12px;
  }
  .dropdown-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .dropdown-link{
    display:block;
    font-size:14.5px;
    color:var(--pm-text-dark);
    padding:8px 10px;
    border-radius:8px;
    transition:background .15s ease, color .15s ease;
  }
  .dropdown-link:hover{
    background:var(--pm-teal-light);
    color:var(--pm-teal-dark);
  }
  #frequentDropdown{
    left:auto;
    right:0;
  }

  /* ---------- Popular-services accent tiles (inside "Популярные сервисы" dropdown) ---------- */
  .pop-tile-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:11px;
  }
  .pop-tile{
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border-radius:12px;
    background:linear-gradient(135deg, var(--pm-navy-dark), var(--pm-teal));
    border:1px solid rgba(255,255,255,.15);
    color:#fff;
    font-weight:600;
    font-size:13.5px;
    line-height:1.3;
    cursor:pointer;
    transition:transform .2s ease, filter .2s ease;
  }
  .pop-tile::before{
    content:"";
    position:absolute;
    top:-20px;
    right:-20px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.1), transparent 70%);
    pointer-events:none;
  }
  .pop-tile:hover{
    transform:translateY(-2px);
    filter:brightness(1.08);
  }
  .pop-tile-icon{
    width:30px;
    height:30px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .pop-tile-grid .qr-wrap{
    display:block;
  }

  /* ---------- QR popup (pages without a real link yet) ---------- */
  .qr-wrap{
    position:relative;
    display:inline-block;
  }
  .qr-trigger{
    font-size:14.5px;
    color:var(--pm-text-dark);
    display:inline-block;
    padding:2px 0;
    border-bottom:1px solid transparent;
    transition:color .15s ease, border-color .15s ease;
    cursor:pointer;
  }
  .qr-trigger:hover{
    color:var(--pm-teal-dark);
    border-bottom-color:var(--pm-teal);
  }
  .qr-popup{
    position:absolute;
    top:calc(100% + 10px);
    left:50%;
    transform:translate(-50%,-6px);
    width:max-content;
    max-width:calc(100vw - 32px);
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.3);
    border-radius:16px;
    box-shadow:var(--shadow-md);
    padding:16px;
    text-align:center;
    opacity:0;
    visibility:hidden;
    transition:opacity .2s ease, transform .2s ease, visibility .2s;
    pointer-events:none;
    z-index:60;
  }
  .qr-wrap:hover .qr-popup,
  .qr-wrap.open .qr-popup{
    opacity:1;
    visibility:visible;
    transform:translate(-50%,0);
    pointer-events:auto;
  }
  .qr-code svg{
    display:block;
    margin:0 auto;
  }
  .qr-caption{
    font-size:12px;
    color:var(--pm-muted);
    margin-top:8px;
    white-space:nowrap;
  }

  /* ---------- Catalog / Accordion ---------- */
  .catalog-hint{
    color:var(--pm-muted);
    font-size:14px;
    margin:-10px 0 18px;
  }
  .accordion{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .accordion-section{
    background:var(--pm-white);
    border-radius:var(--radius);
    box-shadow:var(--shadow-sm);
    overflow:hidden;
  }
  .accordion-header{
    display:flex;
    align-items:center;
    gap:16px;
    padding:18px 22px;
    cursor:pointer;
    user-select:none;
    background:var(--pm-white);
    border:none;
    width:100%;
    text-align:left;
    font-family:inherit;
  }
  .accordion-header:focus-visible{
    outline:2px solid var(--pm-teal);
    outline-offset:-2px;
  }
  .section-icon{
    width:42px;height:42px;
    border-radius:12px;
    background:var(--pm-teal-light);
    color:var(--pm-teal);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .accordion-header h3{
    font-size:16.5px;
    font-weight:700;
    margin:0;
    color:var(--pm-text-dark);
    flex-grow:1;
  }
  .chev{
    color:var(--pm-muted);
    transition:transform .25s ease;
    flex-shrink:0;
  }
  .accordion-section.open .chev{transform:rotate(180deg);}

  .accordion-panel{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
  }
  .accordion-panel-inner{
    background:#eceae4;
    padding:22px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
  }
  .group-title{
    font-weight:700;
    font-size:15px;
    color:var(--pm-muted);
    margin:0 0 10px;
  }
  .service-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .service-item a{
    font-size:14.5px;
    color:var(--pm-text-dark);
    display:inline-block;
    padding:2px 0;
    border-bottom:1px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .service-item a:hover{
    color:var(--pm-teal-dark);
    border-bottom-color:var(--pm-teal);
  }

  .frequent-group{
    grid-column:1 / -1;
    background:rgba(230,244,243,.45);
    border-radius:12px;
    padding:16px 18px;
  }
  .frequent-label{
    display:flex;
    align-items:center;
    gap:6px;
    text-transform:uppercase;
    letter-spacing:.05em;
    font-size:11px;
    font-weight:700;
    color:var(--pm-teal);
    margin-bottom:10px;
  }
  .frequent-label svg{flex-shrink:0;}
  .frequent-group .service-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:6px 20px;
  }

  /* ---------- Tooltip ---------- */
  #tooltip{
    position:fixed;
    z-index:1000;
    background:var(--pm-navy-dark);
    color:#fff;
    font-size:13px;
    padding:8px 14px;
    border-radius:8px;
    box-shadow:var(--shadow-md);
    pointer-events:none;
    opacity:0;
    transform:translate(-50%,-8px);
    transition:opacity .15s ease, transform .15s ease;
    white-space:nowrap;
  }
  #tooltip.show{opacity:1; transform:translate(-50%,-16px);}

  /* ---------- Footer ---------- */
  .site-footer{
    border-top:1px solid var(--pm-border);
    background:var(--pm-bg-page);
    padding:40px 32px;
  }
  .footer-inner{
    max-width:1280px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:16px;
  }
  .footer-label{
    color:var(--pm-muted);
    font-size:14px;
    font-weight:600;
  }
  .footer-social{
    display:flex;
    gap:12px;
  }
  .social-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    background:var(--pm-white);
    color:var(--pm-teal);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:var(--shadow-sm);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .social-btn:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
  }

  /* ---------- Responsive ---------- */
  @media (max-width:980px){
    .accordion-panel-inner{grid-template-columns:1fr;}
    .frequent-group .service-list{grid-template-columns:1fr;}
  }
  @media (max-width:640px){
    .wrap{padding:20px 16px 60px;}
    .header-right{width:100%;}
    .search-box{min-width:0; flex-grow:1; width:100%;}
    .trigger-wrap{width:100%;}
    .accent-trigger{width:100%; justify-content:center;}
    .dropdown-panel{min-width:0; width:100%; left:0; right:0;}
    .pop-tile-grid{grid-template-columns:1fr;}
    .brand-block h1{font-size:24px;}
    .site-footer{padding:32px 16px;}
  }
</style>
</head>

      <div class="trigger-wrap">

        <div class="dropdown-panel" id="frequentDropdown">

        </div>
      </div>
    </div>
  </header>

  <!-- Catalog accordion -->
  <section class="block">
    <h2 class="block-title">Полный каталог сервисов</h2>
    <p class="catalog-hint">Ищите по названию сервиса в строке поиска вверху страницы — подходящие разделы раскроются автоматически.</p>
    <div class="accordion" id="catalogAccordion"></div>
  </section>

</div>

<footer class="site-footer">
  <div class="footer-inner">
    <span class="footer-label">Мы в соцсетях</span>
    <div class="footer-social">
      <a class="social-btn" href="https://t.me/sm_vkurse" target="_blank" rel="noopener" aria-label="Telegram">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>

        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><text x="12" y="16" text-anchor="middle" font-size="11" font-weight="700" font-family="Arial, sans-serif">VK</text></svg>

</footer>

    const size = n * cell + quiet * 2;
    const dark = '#1a2a5e';
    const isFinderZone = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
    let modules = '';
    for (let r = 0; r < n; r++){
      for (let c = 0; c < n; c++){
        if (isFinderZone(r, c)) continue;
        const h = (r * 13 + c * 29 + r * c * 7) % 5;
        if (h < 2){
          modules += '<rect x="'+(quiet+c*cell)+'" y="'+(quiet+r*cell)+'" width="'+cell+'" height="'+cell+'" fill="'+dark+'"/>';
        }
      }
    }
    function finder(fr, fc){
      const x = quiet + fc * cell, y = quiet + fr * cell;
      return '<rect x="'+x+'" y="'+y+'" width="'+(7*cell)+'" height="'+(7*cell)+'" fill="'+dark+'"/>'+
             '<rect x="'+(x+cell)+'" y="'+(y+cell)+'" width="'+(5*cell)+'" height="'+(5*cell)+'" fill="#fff"/>'+
             '<rect x="'+(x+2*cell)+'" y="'+(y+2*cell)+'" width="'+(3*cell)+'" height="'+(3*cell)+'" fill="'+dark+'"/>';
    }
    const finders = finder(0,0) + finder(0,n-7) + finder(n-7,0);
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
      '<rect width="'+size+'" height="'+size+'" fill="#fff"/>'+finders+modules+'</svg>';
  }
  const QR_SVG = buildQrPlaceholder();
  const QR_CAPTION = 'Откройте на телефоне';

  function qrPopupHtml(){
    return '<div class="qr-popup">'+
      '<div class="qr-code">'+QR_SVG+'</div>'+
      '<div class="qr-caption">'+QR_CAPTION+'</div>'+
    '</div>';
  }

  // Renders a catalog list entry: real link, QR trigger (NOLINK), or the classic "#" tooltip placeholder.
  function renderServiceLink(name, url){
    if (url === 'NOLINK'){
      return '<span class="qr-wrap">'+
        '<span class="qr-trigger" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false">'+name+'</span>'+
        qrPopupHtml()+
      '</span>';
    }
    if (url){
      return '<a href="'+url+'">'+name+'</a>';
    }
    return '<a href="#">'+name+'</a>';
  }

  // ---------- Popular services (header dropdown, shown as accent tiles) ----------
  const POPULAR_SERVICES = [
    {n:'Заказать справку', icon:'file'},
    {n:'Библиотека документов', icon:'bookopen'},
    {n:'Оформить отпуск', icon:'sun'},
    {n:'Оформить командировку', icon:'briefcase'},
    {n:'Пропуск (получить/восстановить)', icon:'badge'},
    {n:'База знаний СМ (БУП)', icon:'stack'},
    {n:'Приложение СИЗ', icon:'shield'},
    {n:'Предложить идею', icon:'bulb'}
  ];
  const FREQUENT_SET = new Set(POPULAR_SERVICES.map(s => s.n));

  function renderPopTile(entry){
    const url = NAME_URL[entry.n];
    const iconHtml = '<span class="pop-tile-icon">'+svg(entry.icon, 18)+'</span>';
    if (url === 'NOLINK'){
      return '<div class="qr-wrap">'+
        '<div class="pop-tile qr-tile-trigger" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false">'+
          iconHtml+'<span class="pop-tile-name">'+entry.n+'</span>'+
        '</div>'+
        qrPopupHtml()+
      '</div>';
    }
    return '<a class="pop-tile" href="'+(url || '#')+'">'+iconHtml+'<span class="pop-tile-name">'+entry.n+'</span></a>';
  }

  const frequentGrid = document.getElementById('frequentGrid');
  frequentGrid.innerHTML = POPULAR_SERVICES.map(renderPopTile).join('');

  // ---------- Newbie quick links ----------
  const NEWBIE_SERVICES = [
    'Мой личный кабинет',
    'Подписать кадровый документ (КЭДО)',
    'Электронная трудовая книжка',
    'Пропуск (получить/восстановить)',
    'Структура компании'
  ];
  const newbieList = document.getElementById('newbieList');
  newbieList.innerHTML = NEWBIE_SERVICES.map(name =>
    '<li><a class="dropdown-link" href="'+(NAME_URL[name] || '#')+'">'+name+'</a></li>'
  ).join('');

  // ---------- Trigger dropdowns (hover on desktop, click/tap on mobile) ----------
  document.querySelectorAll('.trigger-wrap > .accent-trigger').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wrap = btn.closest('.trigger-wrap');
      const isOpen = wrap.classList.contains('open');
      document.querySelectorAll('.trigger-wrap.open, .qr-wrap.open').forEach(w => {
        w.classList.remove('open');
        const t = w.querySelector('.accent-trigger, .qr-trigger, .qr-tile-trigger');
        if (t) t.setAttribute('aria-expanded','false');
      });
      if (!isOpen){
        wrap.classList.add('open');
        btn.setAttribute('aria-expanded','true');
      }
    });
  });

  // ---------- QR popup toggles (event delegation: content is built dynamically) ----------
  document.addEventListener('click', (e) => {
    const trigger = e.target.closest('.qr-trigger, .qr-tile-trigger');
    if (!trigger) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    const wrap = trigger.closest('.qr-wrap');
    const isOpen = wrap.classList.contains('open');
    document.querySelectorAll('.trigger-wrap.open, .qr-wrap.open').forEach(w => {
      w.classList.remove('open');
      const t = w.querySelector('.accent-trigger, .qr-trigger, .qr-tile-trigger');
      if (t) t.setAttribute('aria-expanded','false');
    });
    if (!isOpen){
      wrap.classList.add('open');
      trigger.setAttribute('aria-expanded','true');
    }
  });

  document.addEventListener('click', () => {
    document.querySelectorAll('.trigger-wrap.open, .qr-wrap.open').forEach(w => {
      w.classList.remove('open');
      const t = w.querySelector('.accent-trigger, .qr-trigger, .qr-tile-trigger');
      if (t) t.setAttribute('aria-expanded','false');
    });
  });

  const accordion = document.getElementById('catalogAccordion');
  accordion.innerHTML = catalogData.map((section, sIdx) => {
    const freqItems = [];
    section.groups.forEach(g => g.items.forEach(([name, url]) => {
      if (FREQUENT_SET.has(name)) freqItems.push([name, url]);
    }));

    const freqBlock = freqItems.length ?
      '<div class="group frequent-group">'+
        '<div class="frequent-label">'+svg('trend',13)+'Популярные сервисы</div>'+
        '<ul class="service-list">'+
          freqItems.map(([name, url]) =>
            '<li class="service-item" data-search="'+name.toLowerCase()+'">'+renderServiceLink(name, url)+'</li>'
          ).join('')+
        '</ul>'+
      '</div>' : '';

    const groupsHtml = section.groups.map(g => {
      const items = g.items.filter(([name]) => !FREQUENT_SET.has(name));
      if (!items.length) return '';
      return '<div class="group">'+
        '<div class="group-title">'+g.title+'</div>'+
        '<ul class="service-list">'+
          items.map(([name, url]) =>
            '<li class="service-item" data-search="'+name.toLowerCase()+'">'+renderServiceLink(name, url)+'</li>'
          ).join('')+
        '</ul>'+
      '</div>';
    }).join('');

    return '<div class="accordion-section" data-index="'+sIdx+'">'+
      '<button class="accordion-header" aria-expanded="false">'+
        '<div class="section-icon">'+svg(section.icon,20)+'</div>'+
        '<h3>'+section.title+'</h3>'+
        '<span class="chev">'+svg('chevron',18)+'</span>'+
      '</button>'+
      '<div class="accordion-panel">'+
        '<div class="accordion-panel-inner">'+
          freqBlock+groupsHtml+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');

  // ---------- Accordion toggle ----------
  const sections = Array.from(accordion.querySelectorAll('.accordion-section'));
  sections.forEach(sectionEl => {
    const header = sectionEl.querySelector('.accordion-header');
    const panel = sectionEl.querySelector('.accordion-panel');
    header.addEventListener('click', () => {
      const isOpen = sectionEl.classList.contains('open');
      if (isOpen){
        sectionEl.classList.remove('open');
        header.setAttribute('aria-expanded','false');
        panel.style.maxHeight = '0px';
      } else {
        sectionEl.classList.add('open');
        header.setAttribute('aria-expanded','true');
        panel.style.maxHeight = panel.scrollHeight + 'px';
      }
    });
  });

  // ---------- Live search filter ----------
  const searchInput = document.getElementById('globalSearch');
  searchInput.addEventListener('input', () => {
    const query = searchInput.value.trim().toLowerCase();
    const hasQuery = query.length > 0;

    sections.forEach(sectionEl => {
      let sectionHasMatch = false;
      sectionEl.querySelectorAll('.group').forEach(groupEl => {
        let groupHasMatch = false;
        groupEl.querySelectorAll('.service-item').forEach(itemEl => {
          const match = !hasQuery || itemEl.dataset.search.indexOf(query) !== -1;
          itemEl.style.display = match ? '' : 'none';
          if (match) groupHasMatch = true;
        });
        groupEl.style.display = groupHasMatch ? '' : 'none';
        if (groupHasMatch) sectionHasMatch = true;
      });

      sectionEl.style.display = sectionHasMatch ? '' : 'none';

      const header = sectionEl.querySelector('.accordion-header');
      const panel = sectionEl.querySelector('.accordion-panel');

      if (hasQuery && sectionHasMatch){
        sectionEl.classList.add('open');
        header.setAttribute('aria-expanded','true');
        panel.style.maxHeight = panel.scrollHeight + 'px';
      } else if (!hasQuery){
        sectionEl.classList.remove('open');
        header.setAttribute('aria-expanded','false');
        panel.style.maxHeight = '0px';
      } else {
        sectionEl.classList.remove('open');
        panel.style.maxHeight = '0px';
      }
    });
  });

  // ---------- Tooltip on placeholder links ----------
  const tooltip = document.getElementById('tooltip');
  let tooltipTimer = null;
  document.addEventListener('click', (e) => {
    const link = e.target.closest('a[href="#"]');
    if (!link) return;
    e.preventDefault();
    const rect = link.getBoundingClientRect();
    tooltip.style.left = (rect.left + rect.width/2) + 'px';
    tooltip.style.top = rect.top + 'px';
    tooltip.classList.add('show');
    clearTimeout(tooltipTimer);
    tooltipTimer = setTimeout(() => tooltip.classList.remove('show'), 1500);
  });

})();
</script>
</body>
</html>
