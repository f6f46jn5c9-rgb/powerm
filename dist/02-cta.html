<style>
.sm-cta{--sm-navy-dark:#1a2a5e;--sm-teal:#0e7c7b;--sm-teal-dark:#0a5f5e;--sm-teal-light:#e6f4f3;--sm-text:#1a1a2e;--sm-muted:#6b7280;
  --sm-radius:16px;--sm-shadow-sm:0 1px 3px rgba(26,42,94,.08),0 1px 2px rgba(26,42,94,.06);--sm-shadow-md:0 8px 24px rgba(26,42,94,.12);
  box-sizing:border-box;margin:0;display:flex;gap:20px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.3}
.sm-cta *,.sm-cta *::before,.sm-cta *::after{box-sizing:border-box}
.sm-cta a.sm-cta__btn{position:relative;overflow:hidden;flex:1 1 0;min-width:0;display:flex;align-items:center;gap:16px;padding:22px 24px;
  border-radius:var(--sm-radius);text-decoration:none !important;transition:transform .2s ease,box-shadow .2s ease,filter .2s ease;
  opacity:0;animation:sm-cta-in .5s ease forwards;animation-delay:calc(var(--i) * 60ms)}
.sm-cta a.sm-cta__btn--accent{background:linear-gradient(135deg,var(--sm-navy-dark),var(--sm-teal));color:#fff !important;border:1px solid rgba(255,255,255,.15);box-shadow:var(--sm-shadow-md)}
.sm-cta a.sm-cta__btn--accent::before{content:"";position:absolute;top:-40px;right:-30px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);pointer-events:none}
.sm-cta a.sm-cta__btn--alt{background:linear-gradient(135deg,#0a5f5e,#0e7c7b 55%,#1aa7a3);color:#fff !important;border:1px solid rgba(255,255,255,.15);box-shadow:var(--sm-shadow-md)}
.sm-cta a.sm-cta__btn--alt::before{content:"";position:absolute;top:-40px;right:-30px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
.sm-cta a.sm-cta__btn:hover{transform:translateY(-3px)}
.sm-cta a.sm-cta__btn--accent:hover{filter:brightness(1.1);box-shadow:0 12px 30px rgba(14,124,123,.4)}
.sm-cta a.sm-cta__btn--alt:hover{filter:brightness(1.1);box-shadow:0 12px 30px rgba(14,124,123,.4)}
.sm-cta a.sm-cta__btn:focus-visible{outline:3px solid #f5a623;outline-offset:3px}
.sm-cta .sm-cta__icon{flex:0 0 auto;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.sm-cta .sm-cta__icon{background:rgba(255,255,255,.18);color:#fff}
.sm-cta .sm-cta__body{position:relative;flex:1 1 auto;min-width:0}
.sm-cta .sm-cta__title{display:block;font-size:19px;font-weight:700;margin:0}
.sm-cta .sm-cta__hint{display:block;font-size:14px;margin-top:3px}
.sm-cta .sm-cta__hint{color:rgba(255,255,255,.92)}
.sm-cta .sm-cta__arrow{position:relative;flex:0 0 auto;transition:transform .2s ease}
.sm-cta a.sm-cta__btn:hover .sm-cta__arrow{transform:translateX(5px)}
@keyframes sm-cta-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:640px){.sm-cta{flex-direction:column;gap:14px}.sm-cta a.sm-cta__btn{flex:0 0 auto;padding:18px}.sm-cta .sm-cta__title{font-size:17px}}
@media (prefers-reduced-motion:reduce){.sm-cta a.sm-cta__btn{animation:none;opacity:1;transition:none}.sm-cta .sm-cta__arrow{transition:none}}
</style>
<nav class="sm-cta" id="sm-cta" aria-label="Основные действия"></nav>
<script>
(function () {
  var BUTTONS = [
    { title: 'Поделиться практикой', hint: 'Расскажите коллегам о своём опыте', accent: true,
      url: 'https://allforms.severstal.com/passing/787f04af-5596-4227-96df-f37d6604ec30',
      icon: '<path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>' },
    { title: 'Каталог сервисов СМ', hint: 'Все сервисы и инструменты в одном месте', accent: false,
      url: 'https://kb.severstal.com/spaces/BSS/pages/573178683/%D0%9A%D0%B0%D1%82%D0%B0%D0%BB%D0%BE%D0%B3+%D1%81%D0%B5%D1%80%D0%B2%D0%B8%D1%81%D0%BE%D0%B2',
      icon: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>' }
  ];
  function svg(p, w) { return '<svg width="' + w + '" height="' + w + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + p + '</svg>'; }
  var root = document.getElementById('sm-cta');
  root.innerHTML = BUTTONS.map(function (b, i) {
    return '<a class="sm-cta__btn ' + (b.accent ? 'sm-cta__btn--accent' : 'sm-cta__btn--alt') + '" style="--i:' + i + '" href="' + b.url + '" target="_blank" rel="noopener">' +
      '<span class="sm-cta__icon">' + svg(b.icon, 26) + '</span>' +
      '<span class="sm-cta__body"><span class="sm-cta__title">' + b.title + '</span><span class="sm-cta__hint">' + b.hint + '</span></span>' +
      '<span class="sm-cta__arrow">' + svg('<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>', 24) + '</span></a>';
  }).join('');
})();
</script>
