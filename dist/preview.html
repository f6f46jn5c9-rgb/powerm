<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Превью стартовой страницы СМ</title><style>body{margin:0;background:#f2f1ed;font-family:sans-serif}.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px;display:flex;flex-direction:column;gap:32px}.ph{background:#d9dbe0;color:#555;border-radius:12px;padding:14px;text-align:center;font-size:14px}@media(max-width:640px){.wrap{padding:16px}}</style></head><body><main class="wrap"><div><style>
.sm-logo{--sm-navy-dark:#1a2a5e;--sm-navy-blue:#2b4fa8;--sm-teal:#0e7c7b;--sm-teal-dark:#0a5f5e;--sm-muted:#6b7280;
  box-sizing:border-box;position:relative;overflow:hidden;margin:0;padding:22px 32px 26px;min-height:110px;
  display:flex;align-items:center;gap:28px;border-radius:16px;background:#fff;color:var(--sm-navy-dark);
  box-shadow:0 1px 3px rgba(26,42,94,.08),0 8px 24px rgba(14,124,123,.10);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.3;
  animation:sm-logo-in .5s ease both}
.sm-logo *,.sm-logo *::before,.sm-logo *::after{box-sizing:border-box}
.sm-logo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;pointer-events:none;
  background:linear-gradient(90deg,var(--sm-teal-dark),var(--sm-teal) 35%,#35b8b3 70%,rgba(53,184,179,0))}
.sm-logo .sm-logo__img{position:relative;display:block;flex:0 0 auto;height:68px;width:auto;max-width:100%;mix-blend-mode:multiply}
.sm-logo .sm-logo__bar{position:relative;flex:0 0 3px;align-self:stretch;margin:4px 0;border-radius:3px;background:linear-gradient(180deg,#35b8b3,var(--sm-teal-dark))}
.sm-logo .sm-logo__text{position:relative;min-width:0}
.sm-logo h2.sm-logo__title{margin:0 0 4px !important;padding:0 !important;font-size:30px;font-weight:800;line-height:1.15;color:var(--sm-navy-dark) !important;letter-spacing:-.01em;border:0}
.sm-logo .sm-logo__accent{color:var(--sm-teal) !important;background:linear-gradient(90deg,var(--sm-teal-dark),#26a9a4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sm-logo p.sm-logo__sub{margin:0 !important;padding:0 !important;font-size:16px;color:var(--sm-muted) !important}
@keyframes sm-logo-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:900px){.sm-logo{gap:20px;padding:20px 24px 24px}.sm-logo h2.sm-logo__title{font-size:25px}.sm-logo .sm-logo__img{height:56px}}
@media (max-width:640px){.sm-logo{flex-direction:column;align-items:flex-start;gap:12px;padding:18px 18px 22px}
  .sm-logo .sm-logo__img{height:46px}.sm-logo .sm-logo__bar{display:none}
  .sm-logo h2.sm-logo__title{font-size:21px}.sm-logo p.sm-logo__sub{font-size:14.5px}}
@media (prefers-reduced-motion:reduce){.sm-logo{animation:none}}
</style>

<div><style>
.sm-cta{--sm-navy-dark:#1a2a5e;--sm-teal:#0e7c7b;--sm-teal-dark:#0a5f5e;--sm-teal-light:#e6f4f3;--sm-text:#1a1a2e;--sm-muted:#6b7280;
  --sm-radius:16px;--sm-shadow-sm:0 1px 3px rgba(26,42,94,.08),0 1px 2px rgba(26,42,94,.06);--sm-shadow-md:0 8px 24px rgba(26,42,94,.12);
  box-sizing:border-box;margin:0;display:flex;gap:20px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.3}
.sm-cta *,.sm-cta *::before,.sm-cta *::after{box-sizing:border-box}
.sm-cta a.sm-cta__btn{position:relative;overflow:hidden;flex:1 1 0;min-width:0;display:flex;align-items:center;gap:16px;padding:22px 24px;
  border:1.5px solid transparent;border-radius:var(--sm-radius);text-decoration:none !important;color:var(--t1) !important;
  background:linear-gradient(135deg,#fff 0%,var(--glass) 100%) padding-box,linear-gradient(135deg,var(--g1),var(--g2)) border-box;
  box-shadow:0 6px 22px var(--halo);
  transition:transform .2s ease,box-shadow .25s ease;
  animation:sm-cta-in .5s ease backwards;animation-delay:calc(var(--i) * 60ms)}
/* цвета каждой кнопки: g — градиент обводки, t — заголовок, ic — иконка и стрелка, h — заливка подложки иконки на hover */
.sm-cta a.sm-cta__btn--accent{--g1:#1a2a5e;--g2:#0e7c7b;--t1:#1a2a5e;--t2:#0d6f73;--hint:#4a5a85;--ic:#1d5a86;--glass:#f1f6fb;--tint:rgba(14,124,123,.10);
  --i1:rgba(26,42,94,.16);--i2:rgba(14,124,123,.16);--ibd:rgba(26,70,120,.35);--h1:#1a2a5e;--h2:#0e7c7b;--halo:rgba(20,84,108,.22);--halo2:rgba(20,84,108,.36)}
.sm-cta a.sm-cta__btn--alt{--g1:#0a5f5e;--g2:#1aa7a3;--t1:#0a5f5e;--t2:#0c6e6d;--hint:#3a6b6a;--ic:#0e7c7b;--glass:#eefafa;--tint:rgba(26,167,163,.12);
  --i1:rgba(10,95,94,.16);--i2:rgba(26,167,163,.16);--ibd:rgba(14,124,123,.35);--h1:#0a5f5e;--h2:#0e7c7b;--halo:rgba(14,124,123,.22);--halo2:rgba(14,124,123,.36)}
.sm-cta a.sm-cta__btn::before{content:"";position:absolute;top:-40px;right:-30px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,var(--tint),transparent 70%);pointer-events:none}
.sm-cta a.sm-cta__btn:hover{transform:translateY(-3px);box-shadow:0 10px 30px var(--halo2)}
.sm-cta a.sm-cta__btn:focus-visible{outline:3px solid #f5a623;outline-offset:3px}
.sm-cta .sm-cta__icon{position:relative;flex:0 0 auto;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--i1),var(--i2));border:1px solid var(--ibd);color:var(--ic);transition:color .2s ease}
.sm-cta .sm-cta__icon::before{content:"";position:absolute;inset:-1px;border-radius:50%;background:linear-gradient(135deg,var(--h1),var(--h2));opacity:0;transition:opacity .2s ease}
.sm-cta .sm-cta__icon svg{position:relative;display:block}
.sm-cta a.sm-cta__btn:hover .sm-cta__icon{color:#fff}
.sm-cta a.sm-cta__btn:hover .sm-cta__icon::before{opacity:1}
.sm-cta .sm-cta__body{position:relative;flex:1 1 auto;min-width:0}
.sm-cta .sm-cta__title{display:block;width:fit-content;max-width:100%;font-size:19px;font-weight:700;margin:0;color:var(--t1)}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .sm-cta .sm-cta__title{background:linear-gradient(90deg,var(--t1),var(--t2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}}
.sm-cta .sm-cta__hint{display:block;font-size:14px;margin-top:3px;color:var(--hint)}
.sm-cta .sm-cta__arrow{position:relative;flex:0 0 auto;color:var(--ic);transition:transform .2s ease}
.sm-cta a.sm-cta__btn:hover .sm-cta__arrow{transform:translateX(5px)}
@keyframes sm-cta-in{from{opacity:0;transform:translateY(8px)}}
@media (max-width:640px){.sm-cta{flex-direction:column;gap:14px}.sm-cta a.sm-cta__btn{flex:0 0 auto;padding:18px}.sm-cta .sm-cta__title{font-size:17px}}
@media (prefers-reduced-motion:reduce){.sm-cta a.sm-cta__btn{animation:none;transition:none}.sm-cta .sm-cta__arrow,.sm-cta .sm-cta__icon,.sm-cta .sm-cta__icon::before{transition:none}}
</style>

/* ---- плашка: цветной градиент + пятна + стеклянный слой ---- */
.sm-catalog a.sm-catalog__tile{--b1:rgba(150,215,255,.8);--b2:rgba(130,110,255,.55);--b3:rgba(70,150,255,.5);--sh:rgba(26,42,94,.30);
  position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;justify-content:space-between;height:150px;min-width:0;padding:18px;border-radius:var(--sm-radius);

/* размытые цветные пятна — «за стеклом» */
.sm-catalog a.sm-catalog__tile::before{content:"";position:absolute;z-index:0;inset:-24px;pointer-events:none;filter:blur(8px);
  background:radial-gradient(circle at 88% 10%,var(--b1) 0,transparent 42%),radial-gradient(circle at 8% 46%,var(--b2) 0,transparent 36%),radial-gradient(circle at 94% 40%,var(--b3) 0,transparent 32%)}
/* стеклянный слой */
.sm-catalog .sm-catalog__glass{position:absolute;z-index:1;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none;
  background:linear-gradient(0deg,rgba(4,22,46,.58) 0,rgba(4,22,46,.46) 45%,rgba(4,22,46,0) 88%),linear-gradient(rgba(255,255,255,.13),rgba(255,255,255,.13));-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
  border:1px solid rgba(255,255,255,.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 26px rgba(255,255,255,.14);transition:border-color .25s ease}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.sm-catalog .sm-catalog__glass{background:linear-gradient(0deg,rgba(4,22,46,.58) 0,rgba(4,22,46,.46) 45%,rgba(4,22,46,0) 88%),linear-gradient(rgba(255,255,255,.24),rgba(255,255,255,.24))}}

@media (max-width:1100px){.sm-catalog a.sm-catalog__tile{height:140px;padding:16px}}

@media (prefers-reduced-motion:reduce){.sm-catalog a.sm-catalog__tile{animation:none;transition:none}.sm-catalog .sm-catalog__glass,.sm-catalog .sm-catalog__glass::before,.sm-catalog .sm-catalog__arrow{transition:none}.sm-catalog a.sm-catalog__tile:hover .sm-catalog__glass::before{transform:none}}

<script>
(function () {

  var GROUPS = [
    { title: 'Производство и проекты', cls: 'teal', items: [
      { title: 'Практики проектов', icon: 'project', c1: '#4cc7bd', c2: '#0b7a7d', c3: '#095b60', wide: true, url: K + 'spaces/BSS/pages/517603418/%D0%9B%D1%83%D1%87%D1%88%D0%B8%D0%B5+%D0%BF%D1%80%D0%B0%D0%BA%D1%82%D0%B8%D0%BA%D0%B8+%D0%BF%D1%80%D0%BE%D0%B5%D0%BA%D1%82%D0%BE%D0%B2' },
      { title: 'Производство', icon: 'gear', c1: '#3fc2b4', c2: '#0e7c7b', c3: '#0a5f5e', url: K + 'spaces/BSS/pages/167117074/%D0%9F%D1%80%D0%BE%D0%B8%D0%B7%D0%B2%D0%BE%D0%B4%D1%81%D1%82%D0%B2%D0%BE.+%D0%A1%D0%B8%D0%BB%D0%BE%D0%B2%D1%8B%D0%B5+%D0%BC%D0%B0%D1%88%D0%B8%D0%BD%D1%8B' },
      { title: 'Инжиниринг', icon: 'ruler', c1: '#3ab7cb', c2: '#0d7a86', c3: '#0a5a66', url: K + 'spaces/BSS/pages/156860862/%D0%98%D0%BD%D0%B6%D0%B8%D0%BD%D0%B8%D1%80%D0%B8%D0%BD%D0%B3+%D0%A1%D0%9C' },
      { title: 'Управление проектами', icon: 'gantt', c1: '#46c4a2', c2: '#0f8070', c3: '#0a5f52', url: K + 'spaces/BSS/pages/259457050/%D0%A3%D0%BF%D1%80%D0%B0%D0%B2%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5+%D0%BF%D1%80%D0%BE%D0%B5%D0%BA%D1%82%D0%B0%D0%BC%D0%B8+Agile+%D0%B8+%D0%BF%D1%80%D0%B5%D0%B4%D0%B8%D0%BA%D1%82%D0%B8%D0%B2%D0%BD%D1%8B%D0%B9+%D0%BF%D0%BE%D0%B4%D1%85%D0%BE%D0%B4%D1%8B+.+%D0%A1%D0%B8%D0%BB%D0%BE%D0%B2%D1%8B%D0%B5+%D0%BC%D0%B0%D1%88%D0%B8%D0%BD%D1%8B' },
      { title: 'ДСАЭМ', icon: 'bolt', c1: '#34b0c4', c2: '#0e7487', c3: '#0a5a6a', url: K + 'pages/viewpage.action?pageId=189235313' }
    ] },
    { title: 'Обеспечивающие функции', cls: 'blue', items: [
      { title: 'Закупки', icon: 'cart', c1: '#5aa0e6', c2: '#2b4fa8', c3: '#1a2a5e', url: K + 'spaces/BSS/pages/167117077/%D0%97%D0%B0%D0%BA%D1%83%D0%BF%D0%BA%D0%B8.+%D0%A1%D0%B8%D0%BB%D0%BE%D0%B2%D1%8B%D0%B5+%D0%BC%D0%B0%D1%88%D0%B8%D0%BD%D1%8B' },
      { title: 'IT', icon: 'code', c1: '#58bdea', c2: '#2a58b5', c3: '#1b3470', url: K + 'spaces/BSS/pages/186318879/IT+%D0%A1%D0%9C' },
      { title: 'Охрана труда', icon: 'shield', c1: '#7b9cf0', c2: '#3350b0', c3: '#1a2a5e', url: K + 'spaces/BSS/pages/520651883/%D0%9E%D1%85%D1%80%D0%B0%D0%BD%D0%B0+%D1%82%D1%80%D1%83%D0%B4%D0%B0+%D0%A1%D0%9C' },
      { title: 'Управление изменениями', icon: 'cycle', c1: '#4aaee0', c2: '#24569e', c3: '#172c5c', url: K + 'spaces/BSS/pages/373686311/%D0%A3%D0%BF%D1%80%D0%B0%D0%B2%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5+%D0%B8%D0%B7%D0%BC%D0%B5%D0%BD%D0%B5%D0%BD%D0%B8%D1%8F%D0%BC%D0%B8+%D0%A1%D0%9C' },
      { title: 'Внешние практики', icon: 'globe', c1: '#6a5ae0', c2: '#2c52c8', c3: '#1a2a5e', violet: true, url: K + 'spaces/BSS/pages/167117099/%D0%92%D0%BD%D0%B5%D1%88%D0%BD%D0%B8%D0%B5+%D0%BF%D1%80%D0%B0%D0%BA%D1%82%D0%B8%D0%BA%D0%B8.+%D0%A1%D0%B8%D0%BB%D0%BE%D0%B2%D1%8B%D0%B5+%D0%BC%D0%B0%D1%88%D0%B8%D0%BD%D1%8B' },
      { title: 'Практики-идеи', icon: 'bulb', c1: '#5aa0e6', c2: '#2b4fa8', c3: '#1a2a5e', url: K + 'spaces/BSS/pages/238519134/%D0%9F%D1%80%D0%B0%D0%BA%D1%82%D0%B8%D0%BA%D0%B8-%D0%B8%D0%B4%D0%B5%D0%B8' }
    ] }
  ];
  // Контурные иконки (viewBox 24, stroke белый 1.7)
  var ICONS = {
    project: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/><path d="M6 8.5v6M6 8.5h2.5l-.8 1.2.8 1.2H6"/><path d="M11.5 8h1M11.5 11h1M17.5 8h1"/>',
    gear: '<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
    ruler: '<path d="M4 20V5l13 15z"/><path d="M8 16v-4l4 4z"/><path d="M14.5 4.5l5 5-8 8"/><path d="M16.5 6.5l1.2 1.2M18 5l1 1M13.5 9.5l1.2 1.2"/>',
    gantt: '<path d="M3 4v16h18"/><rect x="6" y="6" width="7" height="3" rx="1"/><rect x="9" y="11" width="8" height="3" rx="1"/><rect x="13" y="16" width="6" height="2.6" rx="1"/>',
    bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
    cart: '<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L20 7H6"/>',
    code: '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M9.5 8.5L7 10.5l2.5 2M14.5 8.5l2.5 2-2.5 2"/>',
    shield: '<path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
    cycle: '<path d="M20 12a8 8 0 0 0-13.7-5.6L4 8.5"/><path d="M4 4v4.5h4.5"/><path d="M4 12a8 8 0 0 0 13.7 5.6L20 15.5"/><path d="M20 20v-4.5h-4.5"/>',
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
    bulb: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>'
  };
  var ARROW = '<svg class="sm-catalog__arrow" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 12h15"/><path d="M14 7l5 5-5 5"/></svg>';

  var SIZES = ['', '16px', '15px', '14px', '13px'];
  function fit() {
    var names = root.querySelectorAll('.sm-catalog__name');
    for (var i = 0; i < names.length; i++) {
      var el = names[i];
      if (el.parentNode.parentNode.classList.contains('sm-catalog__tile--wide')) continue;
      var probe = document.createElement('span');
      probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font:inherit;letter-spacing:inherit';
      el.appendChild(probe);
      var words = el.textContent.split(/\s+/).filter(Boolean);
      for (var s = 0; s < SIZES.length; s++) {
        el.style.fontSize = SIZES[s];
        var max = 0;
        words.forEach(function (w) { probe.textContent = w; max = Math.max(max, probe.getBoundingClientRect().width); });
        if (max <= el.clientWidth + 0.5) break;
      }
      el.removeChild(probe);
    }
  }

  if (window.ResizeObserver) new ResizeObserver(function () { fit(); }).observe(root);
  else window.addEventListener('resize', fit);
})();

<div><!--
КАК НАСТРОИТЬ (блок «Новые опубликованные практики»)
Всё, что можно менять, — в блоке CONFIG в начале скрипта (значения в кавычках).
1. ANCESTOR_PAGE_ID — число-ID родительской страницы. Берётся из ссылки на неё: .../pages/161546386/... или pageId=161546386.
   Практики ищутся среди всех страниц ПОД этой страницей.
2. LABEL — метка, которая должна стоять на странице практики. Сейчас «силовые_машины». В блок попадают только страницы,
   у которых есть эта метка И которые лежат под ANCESTOR_PAGE_ID (оба условия сразу).
3. SPACE_KEY — ключ пространства (BSS). Пустая строка '' — не ограничивать пространством.
4. LIMIT — сколько карточек показывать; NEW_BADGE_DAYS — сколько дней висит бейдж «Новое».
5. ALL_PRACTICES_URL — куда ведёт «Все практики →».
6. SHOW_DIAGNOSTICS — true: под заголовком мелким серым текстом видно, что происходит (адрес запроса и причина, если нет карточек).
   Когда всё заработает, поставьте false.
Если карточек нет или запрос не удался, блок не пропадает: показывается карточка «Новые практики появятся здесь» с кнопкой «Все практики →».
-->

<section class="sm-new" id="sm-new" aria-labelledby="sm-new-title" aria-live="polite">
  <div class="sm-new__head">
    <h2 class="sm-new__title" id="sm-new-title">Новые опубликованные практики</h2>
    <a class="sm-new__all" id="sm-new-all" href="#" hidden>Все практики →</a>
  </div>
  <p class="sm-new__diag" id="sm-new-diag" hidden></p>
  <div class="sm-new__grid" id="sm-new-grid"></div>
</section>
<script>
(function () {
  // ===== НАСТРОЙКИ (правьте только значения) =====
  const CONFIG = {
    SPACE_KEY: 'BSS',                 // ключ пространства ('' — не ограничивать)
    ANCESTOR_PAGE_ID: '161546386',    // ID родительской страницы (из ссылки: /pages/<ID>/ или pageId=<ID>)
    LABEL: 'силовые_машины',          // метка, которая должна стоять на странице практики
    LIMIT: 6,                         // сколько карточек показывать
    NEW_BADGE_DAYS: 14,               // сколько дней показывать бейдж «Новое»
    ALL_PRACTICES_URL: 'https://kb.severstal.com/spaces/BSS/pages/161546386/%D0%A1%D0%9C', // куда ведёт «Все практики →»
    SHOW_DIAGNOSTICS: true            // true — показывать причину под заголовком; потом поставьте false
  };
  // ===== конец настроек =====

  const grid = document.getElementById('sm-new-grid');
  const allLink = document.getElementById('sm-new-all');
  const diag = document.getElementById('sm-new-diag');
  const fmt = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function safeUrl(u) { return /^(https?:)?\//.test(u || '') ? u : '#'; }

  function showDiag(msg, requestUrl) {
    if (!CONFIG.SHOW_DIAGNOSTICS) return;
    diag.innerHTML = 'Диагностика: ' + esc(msg) + (requestUrl ? '<br>Адрес запроса: ' + esc(requestUrl) : '');
    diag.hidden = false;
  }

  function allBtn() {
    return CONFIG.ALL_PRACTICES_URL ? '<a class="sm-new__btn" href="' + esc(CONFIG.ALL_PRACTICES_URL) + '">Все практики →</a>' : '';
  }

  // Заглушка: блок никогда не остаётся пустым.
  function renderPlaceholder() {
    if (CONFIG.ALL_PRACTICES_URL) { allLink.href = CONFIG.ALL_PRACTICES_URL; allLink.hidden = false; }
    grid.innerHTML = '<div class="sm-new__empty"><div><div class="sm-new__empty-title">Новые практики появятся здесь</div>' +
      '<div class="sm-new__empty-text">Весь накопленный опыт коллег — в разделе «Все практики».</div></div>' + allBtn() + '</div>';
  }

  function skeleton() {
    var h = '';
    for (var i = 0; i < Math.min(CONFIG.LIMIT, 6); i++) h += '<div class="sm-new__skel" aria-hidden="true"></div>';
    grid.innerHTML = h;
  }

  function renderCards(items) {
    if (CONFIG.ALL_PRACTICES_URL) { allLink.href = CONFIG.ALL_PRACTICES_URL; allLink.hidden = false; }
    var now = Date.now();
    grid.innerHTML = items.slice(0, CONFIG.LIMIT).map(function (it, i) {
      var d = it.date ? new Date(it.date) : null;
      var valid = d && !isNaN(d);
      var isNew = valid && (now - d.getTime()) < CONFIG.NEW_BADGE_DAYS * 864e5;
      return '<a class="sm-new__card' + (isNew ? ' sm-new__card--has-badge' : '') + '" style="--i:' + i + '" href="' + esc(safeUrl(it.url)) + '">' +
        (isNew ? '<span class="sm-new__badge">Новое</span>' : '') +
        '<span class="sm-new__name">' + esc(it.title) + '</span>' +
        '<span class="sm-new__meta">' + (valid ? '<span>' + fmt.format(d) + '</span>' : '') + '</span></a>';
    }).join('');
  }

  function fail(msg, requestUrl) {
    console.warn('[SM] Новые практики: ' + msg + (requestUrl ? ' Запрос: ' + requestUrl : ''));
    showDiag(msg, requestUrl);
    renderPlaceholder();
  }

  function pageUrl(data, r) {
    var webui = (r._links && r._links.webui) || '';
    var base = (data._links && data._links.base) || '';
    if (/^https?:/.test(webui)) return webui;
    if (base) return base.replace(/\/$/, '') + webui;                 // base уже содержит context path
    var ctx = (window.AJS && AJS.contextPath && AJS.contextPath()) || '';
    return location.origin + ctx + webui;
  }

  // Составной фильтр: страница лежит под ANCESTOR_PAGE_ID И имеет метку LABEL.
  function buildCql() {
    var c = 'ancestor=' + CONFIG.ANCESTOR_PAGE_ID + ' AND label="' + CONFIG.LABEL.replace(/"/g, '') + '" AND type=page';
    if (CONFIG.SPACE_KEY) c += ' AND space="' + CONFIG.SPACE_KEY + '"';
    return c + ' ORDER BY created DESC';
  }

  try {
    renderPlaceholder();                       // сразу есть что показать
    if (!CONFIG.ANCESTOR_PAGE_ID) { fail('ID страницы не задан (ANCESTOR_PAGE_ID).'); return; }
    if (!CONFIG.LABEL) { fail('метка не задана (LABEL).'); return; }
    if (!window.fetch) { fail('браузер не поддерживает запросы (fetch).'); return; }

    // Адреса по очереди: сначала относительный, потом с context path Confluence (если он есть).
    var path = '/rest/api/content/search?cql=' + encodeURIComponent(buildCql()) + '&limit=' + CONFIG.LIMIT + '&expand=history';
    var ctx = (window.AJS && AJS.contextPath && AJS.contextPath()) || '';
    var urls = [path];
    if (ctx && ctx !== '/') urls.push(ctx.replace(/\/$/, '') + path);

    skeleton();

    var lastErr = null, lastUrl = urls[0];
    (function attempt(i) {
      lastUrl = urls[i];
      var ctl = window.AbortController ? new AbortController() : null;
      var timedOut = false;
      var timer = setTimeout(function () { timedOut = true; if (ctl) ctl.abort(); }, 8000);
      fetch(urls[i], { credentials: 'same-origin', headers: { 'Accept': 'application/json' }, signal: ctl ? ctl.signal : undefined })
        .then(function (res) {
          if (!res.ok) { var e = new Error('http'); e.status = res.status; throw e; }
          return res.json();
        })
        .then(function (data) {
          clearTimeout(timer);
          var items = (data.results || []).map(function (r) {
            return { title: r.title, url: pageUrl(data, r), date: r.history && r.history.createdDate };
          });
          if (!items.length) {
            fail('практик не найдено (под страницей ' + CONFIG.ANCESTOR_PAGE_ID + ' нет страниц с меткой «' + CONFIG.LABEL + '» или нет доступа к ним).', decodeURIComponent(urls[i]));
            return;
          }
          showDiag('загружено практик: ' + items.length + '.', decodeURIComponent(urls[i]));
          renderCards(items);
        })
        .catch(function (e) {
          clearTimeout(timer);
          lastErr = { e: e, timedOut: timedOut };
          if (i + 1 < urls.length) { attempt(i + 1); return; }      // пробуем адрес с context path
          var msg;
          if (e && e.status) msg = 'запрос вернул ошибку ' + e.status + (e.status === 401 || e.status === 403 ? ' (нет доступа — войдите в Confluence или проверьте права на страницу).' : e.status === 404 ? ' (ресурс не найден — проверьте ID страницы).' : '.');
          else if (timedOut) msg = 'сервер не ответил за 8 секунд.';
          else if (e instanceof SyntaxError) msg = 'сервер вернул не данные, а другую страницу (возможно, нужно заново войти в систему).';
          else msg = 'не удалось связаться с сервером (нет сети или запрос блокирует политика безопасности страницы).';
          fail(msg, decodeURIComponent(lastUrl));
        });
    })(0);
  } catch (err) {
    fail('внутренняя ошибка скрипта: ' + (err && err.message) + '.');
  }
})();
</script>
</div>

      '<div class="sm-curators__info"><div class="sm-curators__name">' + esc(c.name) + '</div><div class="sm-curators__role">' + ROLE + '</div>' +

  }).join('');
