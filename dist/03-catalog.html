<style>
.sm-catalog{--sm-navy-dark:#1a2a5e;--sm-navy-blue:#2b4fa8;--sm-teal:#0e7c7b;--sm-teal-dark:#0a5f5e;--sm-text:#1a1a2e;--sm-radius:18px;
  box-sizing:border-box;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.3;color:var(--sm-text)}
.sm-catalog *,.sm-catalog *::before,.sm-catalog *::after{box-sizing:border-box}
.sm-catalog h2.sm-catalog__title{margin:0 0 20px !important;padding:0 !important;font-size:26px;font-weight:800;color:var(--sm-navy-dark) !important;border:0}
.sm-catalog .sm-catalog__group{margin:0 0 30px}
.sm-catalog .sm-catalog__group:last-child{margin-bottom:0}
.sm-catalog h3.sm-catalog__sub{display:flex;align-items:center;gap:10px;margin:0 0 14px !important;padding:0 !important;font-size:18px;font-weight:700;border:0}
.sm-catalog h3.sm-catalog__sub::before{content:"";width:5px;height:22px;border-radius:3px}
.sm-catalog .sm-catalog__group--blue h3.sm-catalog__sub{color:var(--sm-navy-blue) !important}
.sm-catalog .sm-catalog__group--blue h3.sm-catalog__sub::before{background:linear-gradient(180deg,#5aa0e6,var(--sm-navy-blue))}
.sm-catalog .sm-catalog__group--teal h3.sm-catalog__sub{color:var(--sm-teal-dark) !important}
.sm-catalog .sm-catalog__group--teal h3.sm-catalog__sub::before{background:linear-gradient(180deg,#35b8b3,var(--sm-teal-dark))}
.sm-catalog .sm-catalog__grid{display:grid;gap:14px;grid-template-columns:repeat(6,minmax(0,1fr))}

/* ---- плашка: цветной градиент + пятна + стеклянный слой ---- */
.sm-catalog .sm-catalog__tile{--b1:rgba(150,215,255,.8);--b2:rgba(130,110,255,.55);--b3:rgba(70,150,255,.5);--sh:rgba(26,42,94,.30);
  position:relative;isolation:isolate;display:flex;flex-direction:column;justify-content:space-between;height:150px;min-width:0;padding:18px;border-radius:var(--sm-radius);
  color:#fff !important;text-decoration:none !important;
  background:linear-gradient(200deg,var(--c1) 0%,var(--c2) 38%,var(--c3) 100%);
  box-shadow:0 10px 26px var(--sh),0 2px 6px rgba(26,42,94,.12);
  animation:sm-cat-in .5s ease backwards;animation-delay:calc(var(--i) * 45ms);transition:transform .25s ease,box-shadow .25s ease}
.sm-catalog .sm-catalog__group--teal .sm-catalog__tile{--b1:rgba(160,255,236,.75);--b2:rgba(40,205,195,.55);--b3:rgba(120,205,255,.42);--sh:rgba(10,95,94,.30)}
.sm-catalog .sm-catalog__tile--wide{grid-column:span 2}
.sm-catalog .sm-catalog__tile--violet{--b1:rgba(180,160,255,.85);--b2:rgba(90,175,255,.6);--b3:rgba(200,120,255,.5);--sh:rgba(60,50,170,.38)}
/* декоративный слой: именно он обрезает размытые пятна по скруглению (текст не обрезается) */
.sm-catalog .sm-catalog__fx{position:absolute;z-index:0;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none}
.sm-catalog .sm-catalog__fx::before{content:"";position:absolute;inset:-24px;filter:blur(8px);
  background:radial-gradient(circle at 88% 10%,var(--b1) 0,transparent 42%),radial-gradient(circle at 8% 46%,var(--b2) 0,transparent 36%),radial-gradient(circle at 94% 40%,var(--b3) 0,transparent 32%)}
/* стеклянный слой */
.sm-catalog .sm-catalog__glass{position:absolute;z-index:1;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none;
  background:linear-gradient(0deg,rgba(4,22,46,.58) 0,rgba(4,22,46,.46) 45%,rgba(4,22,46,0) 88%),linear-gradient(rgba(255,255,255,.13),rgba(255,255,255,.13));-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
  border:1px solid rgba(255,255,255,.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 26px rgba(255,255,255,.14);transition:border-color .25s ease}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.sm-catalog .sm-catalog__glass{background:linear-gradient(0deg,rgba(4,22,46,.58) 0,rgba(4,22,46,.46) 45%,rgba(4,22,46,0) 88%),linear-gradient(rgba(255,255,255,.24),rgba(255,255,255,.24))}}
.sm-catalog .sm-catalog__glass::before{content:"";position:absolute;inset:-14px;background:linear-gradient(135deg,rgba(255,255,255,.35) 0,rgba(255,255,255,0) 42%);transition:transform .45s ease}
.sm-catalog .sm-catalog__tile:hover{transform:translateY(-3px);box-shadow:0 16px 32px var(--sh),0 3px 8px rgba(26,42,94,.14)}
.sm-catalog .sm-catalog__tile:hover .sm-catalog__glass{border-color:rgba(255,255,255,.85)}
.sm-catalog .sm-catalog__tile:hover .sm-catalog__glass::before{transform:translate(12px,12px)}
.sm-catalog .sm-catalog__tile:focus-visible{outline:3px solid var(--sm-navy-dark);outline-offset:3px}

/* ---- плашка с вложенными ссылками (Бизнес-система СМ): вся плашка кликабельна, чипы — отдельные ссылки ---- */
.sm-catalog .sm-catalog__main{position:static;color:inherit !important;text-decoration:none !important}
.sm-catalog .sm-catalog__main::after{content:"";position:absolute;inset:0;z-index:2;border-radius:inherit}
.sm-catalog .sm-catalog__main:focus-visible{outline:3px solid var(--sm-navy-dark);outline-offset:3px}
.sm-catalog .sm-catalog__subs{position:relative;z-index:3;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin-left:auto;min-width:0}
.sm-catalog a.sm-catalog__chip{display:inline-block;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;line-height:1.2;white-space:nowrap;
  color:#fff !important;text-decoration:none !important;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.55);transition:background .2s ease,color .2s ease}
.sm-catalog a.sm-catalog__chip:hover{background:#fff;color:#0a5f5e !important}
.sm-catalog a.sm-catalog__chip:focus-visible{outline:3px solid #fff;outline-offset:2px}
@container smcat (max-width:999px){.sm-catalog .sm-catalog__subs{flex-direction:column;align-items:flex-end}}

/* ---- содержимое ---- */
.sm-catalog .sm-catalog__icon{position:relative;z-index:2;flex:0 0 auto;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.sm-catalog .sm-catalog__icon svg{display:block}
.sm-catalog .sm-catalog__top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sm-catalog .sm-catalog__bottom{position:relative;z-index:2;margin-top:auto}
.sm-catalog .sm-catalog__name{display:block;margin:0;font-size:var(--sm-name-fs,19px);font-weight:700;line-height:1.2;
  word-break:normal;overflow-wrap:normal;-webkit-hyphens:manual;hyphens:manual;text-wrap:balance;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.sm-catalog .sm-catalog__tile--wide .sm-catalog__name{font-size:var(--sm-wide-fs,24px)}
.sm-catalog .sm-catalog__note{display:block;margin-top:4px;font-size:14px;font-weight:500;line-height:1.2;opacity:.92;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.sm-catalog .sm-catalog__arrow{flex:0 0 auto;display:block;opacity:.9;transition:transform .25s ease,opacity .25s ease}
.sm-catalog .sm-catalog__tile:hover .sm-catalog__arrow{transform:translateX(4px);opacity:1}
@keyframes sm-cat-in{from{opacity:0;transform:translateY(8px)}}
.sm-catalog .sm-catalog__wrap{container-type:inline-size;container-name:smcat}
@container smcat (max-width:1100px){.sm-catalog .sm-catalog__tile{height:140px;padding:16px}}
@container smcat (max-width:999px){.sm-catalog .sm-catalog__grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container smcat (max-width:639px){.sm-catalog .sm-catalog__grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
/* страховка из скрипта: если слово не влезает даже при 14px, раскладка переключается на 3 / 2 колонки */
.sm-catalog .sm-catalog__wrap[data-force="3"] .sm-catalog__grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.sm-catalog .sm-catalog__wrap[data-force="2"] .sm-catalog__grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
/* браузеры без container queries: те же пороги по ширине окна */
@supports not (container-type:inline-size){
  @media (max-width:1100px){.sm-catalog .sm-catalog__tile{height:140px;padding:16px}}
  @media (max-width:999px){.sm-catalog .sm-catalog__grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:639px){.sm-catalog .sm-catalog__grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
}
@media (max-width:639px){.sm-catalog h2.sm-catalog__title{font-size:22px}}
@media (prefers-reduced-motion:reduce){.sm-catalog .sm-catalog__tile{animation:none;transition:none}.sm-catalog .sm-catalog__glass,.sm-catalog .sm-catalog__glass::before,.sm-catalog .sm-catalog__arrow{transition:none}.sm-catalog .sm-catalog__tile:hover .sm-catalog__glass::before{transform:none}}
</style>
<section class="sm-catalog" id="sm-catalog" aria-labelledby="sm-catalog-title">
  <h2 class="sm-catalog__title" id="sm-catalog-title">Каталог практик</h2>
  <div class="sm-catalog__wrap" id="sm-catalog-groups"></div>
</section>
<script>

    { title: 'Производство и проекты', cls: 'teal', items: [

      { title: 'Производство', icon: 'gear', c1: '#3fc2b4', c2: '#0e7c7b', c3: '#0a5f5e', url: K + 'spaces/BSS/pages/167117074/%D0%9F%D1%80%D0%BE%D0%B8%D0%B7%D0%B2%D0%BE%D0%B4%D1%81%D1%82%D0%B2%D0%BE.+%D0%A1%D0%B8%D0%BB%D0%BE%D0%B2%D1%8B%D0%B5+%D0%BC%D0%B0%D1%88%D0%B8%D0%BD%D1%8B' },
      { title: 'Инжиниринг', icon: 'ruler', c1: '#3ab7cb', c2: '#0d7a86', c3: '#0a5a66', url: K + 'spaces/BSS/pages/156860862/%D0%98%D0%BD%D0%B6%D0%B8%D0%BD%D0%B8%D1%80%D0%B8%D0%BD%D0%B3.+%D0%A1%D0%B8%D0%BB%D0%BE%D0%B2%D1%8B%D0%B5+%D0%BC%D0%B0%D1%88%D0%B8%D0%BD%D1%8B' },

      { title: 'HR', icon: 'people', c1: '#5aa0e6', c2: '#2b4fa8', c3: '#1a2a5e', url: K + 'spaces/BSS/pages/168891558/HR.+%D0%A1%D0%B8%D0%BB%D0%BE%D0%B2%D1%8B%D0%B5+%D0%BC%D0%B0%D1%88%D0%B8%D0%BD%D1%8B' },
      { title: 'Охрана труда', icon: 'shield', c1: '#7b9cf0', c2: '#3350b0', c3: '#1a2a5e', url: K + 'spaces/BSS/pages/520651883/%D0%9E%D1%85%D1%80%D0%B0%D0%BD%D0%B0+%D1%82%D1%80%D1%83%D0%B4%D0%B0.+%D0%A1%D0%B8%D0%BB%D0%BE%D0%B2%D1%8B%D0%B5+%D0%BC%D0%B0%D1%88%D0%B8%D0%BD%D1%8B' },
      { title: 'Внешние практики', icon: 'globe', c1: '#6a5ae0', c2: '#2c52c8', c3: '#1a2a5e', violet: true, url: K + 'spaces/BSS/pages/167117099/%D0%92%D0%BD%D0%B5%D1%88%D0%BD%D0%B8%D0%B5+%D0%BF%D1%80%D0%B0%D0%BA%D1%82%D0%B8%D0%BA%D0%B8.+%D0%A1%D0%B8%D0%BB%D0%BE%D0%B2%D1%8B%D0%B5+%D0%BC%D0%B0%D1%88%D0%B8%D0%BD%D1%8B' },

      return '<a class="' + cls + '" ' + st + ' href="' + it.url + '" target="_blank" rel="noopener">' + fx +
        '<span class="sm-catalog__top"><span class="sm-catalog__icon">' + icon(it.icon) + '</span>' + ARROW + '</span>' +
        '<span class="sm-catalog__bottom"><span class="sm-catalog__name">' + it.title + '</span>' + (it.note ? '<span class="sm-catalog__note">' + it.note + '</span>' : '') + '</span></a>';
    }).join('');
    return '<div class="sm-catalog__group sm-catalog__group--' + g.cls + '"><h3 class="sm-catalog__sub">' + g.title + '</h3><div class="sm-catalog__grid">' + tiles + '</div></div>';
  }).join('');

  // Размер шрифта названий: один на все обычные плашки (и один для широкой). Берём самое длинное «слово»
  // (перенос возможен только по пробелу и после дефиса), подбираем максимальный размер 14–19px, при котором оно
  // влезает в ширину плашки минус отступы. Если не влезает даже 14px — раскладка переключается на 3, затем на 2 колонки.
  var MAX_FS = 19, MIN_FS = 14, WIDE_MAX = 24, WIDE_MIN = 22;
  var tilesAll = root.querySelectorAll('.sm-catalog__tile');
  var normal = [], wide = [];
  Array.prototype.forEach.call(tilesAll, function (tl) { (tl.classList.contains('sm-catalog__tile--wide') ? wide : normal).push(tl.querySelector('.sm-catalog__name')); });
  function wordsOf(els) {
    var out = [];
    els.forEach(function (el) { el.textContent.replace(/-/g, '- ').split(/\s+/).forEach(function (w) { if (w) out.push(w); }); });
    return out;
  }
  var normalWords = wordsOf(normal), wideWords = wordsOf(wide);
  function longest(probe, words, size) {
    probe.style.fontSize = size + 'px';
    var max = 0;
    words.forEach(function (w) { probe.textContent = w; max = Math.max(max, probe.getBoundingClientRect().width); });
    return max;
  }
  function pick(probe, words, avail, hi, lo) {
    for (var s = hi; s >= lo; s -= 0.5) if (longest(probe, words, s) <= avail - 1) return { size: s, fits: true };
    return { size: lo, fits: false };
  }
  function fit() {
    if (!normal.length) return;
    var probe = document.createElement('span');
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font:inherit;font-weight:700;letter-spacing:inherit';
    normal[0].appendChild(probe);
    var forces = ['', '3', '2'], res;
    for (var f = 0; f < forces.length; f++) {
      if (forces[f]) root.setAttribute('data-force', forces[f]); else root.removeAttribute('data-force');
      var availN = Math.min.apply(null, normal.map(function (el) { return el.clientWidth; }));
      res = pick(probe, normalWords, availN, MAX_FS, MIN_FS);
      if (res.fits) break;
    }
    root.style.setProperty('--sm-name-fs', res.size + 'px');
    normal[0].removeChild(probe);
    if (wide.length) {
      var wp = document.createElement('span');
      wp.style.cssText = probe.style.cssText;
      wide[0].appendChild(wp);
      var wr = pick(wp, wideWords, wide[0].clientWidth, WIDE_MAX, WIDE_MIN);
      root.style.setProperty('--sm-wide-fs', wr.size + 'px');
      wide[0].removeChild(wp);
    }
  }
  fit();
  var lastW = 0;
  if (window.ResizeObserver) new ResizeObserver(function () { var w = Math.round(root.getBoundingClientRect().width); if (w !== lastW) { lastW = w; fit(); } }).observe(root);
  else window.addEventListener('resize', fit);
})();
</script>
