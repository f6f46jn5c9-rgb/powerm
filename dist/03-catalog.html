<style>
.sm-catalog{--sm-navy-dark:#1a2a5e;--sm-navy-blue:#2b4fa8;--sm-teal:#0e7c7b;--sm-teal-dark:#0a5f5e;--sm-text:#1a1a2e;--sm-radius:18px;
  box-sizing:border-box;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.3;color:var(--sm-text)}
.sm-catalog *,.sm-catalog *::before,.sm-catalog *::after{box-sizing:border-box}
.sm-catalog h2.sm-catalog__title{margin:0 0 20px !important;padding:0 !important;font-size:26px;font-weight:800;color:var(--sm-navy-dark) !important;border:0}
.sm-catalog .sm-catalog__group{margin:0 0 30px}
.sm-catalog .sm-catalog__group:last-child{margin-bottom:0}
.sm-catalog h3.sm-catalog__sub{display:flex;align-items:center;gap:10px;margin:0 0 14px !important;padding:0 !important;font-size:18px;font-weight:700;color:var(--sm-teal-dark) !important;border:0}
.sm-catalog h3.sm-catalog__sub::before{content:"";width:5px;height:22px;border-radius:3px;background:linear-gradient(180deg,#35b8b3,var(--sm-teal-dark))}
.sm-catalog .sm-catalog__grid{display:grid;gap:14px;grid-template-columns:repeat(6,minmax(0,1fr))}
.sm-catalog a.sm-catalog__tile{position:relative;overflow:hidden;display:block;height:200px;min-width:0;padding:18px 18px 0;border-radius:var(--sm-radius);
  color:#fff !important;text-decoration:none !important;border:1px solid rgba(255,255,255,.25);
  background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 16px rgba(10,95,94,.2);
  opacity:0;animation:sm-cat-in .5s ease forwards;animation-delay:calc(var(--i) * 45ms);transition:transform .2s ease,box-shadow .2s ease}
.sm-catalog a.sm-catalog__tile--wide{grid-column:span 2}
.sm-catalog a.sm-catalog__tile::before{content:"";position:absolute;top:-50px;right:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);pointer-events:none}
.sm-catalog a.sm-catalog__tile:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(10,95,94,.34)}
.sm-catalog a.sm-catalog__tile:focus-visible{outline:3px solid var(--sm-navy-dark);outline-offset:3px}
.sm-catalog .sm-catalog__name{position:relative;z-index:2;display:block;max-width:88%;font-size:17px;font-weight:800;line-height:1.22;overflow-wrap:break-word;margin:0}
.sm-catalog .sm-catalog__fig{position:absolute;z-index:1;right:-16%;bottom:-20%;width:82%;aspect-ratio:1;pointer-events:none;transform-origin:70% 70%;transition:transform .4s ease}
.sm-catalog a.sm-catalog__tile--wide .sm-catalog__fig{right:-3%;bottom:-18%;width:auto;height:116%;aspect-ratio:3/2}
.sm-catalog .sm-catalog__fig svg{display:block;width:100%;height:100%;overflow:visible}
.sm-catalog a.sm-catalog__tile:hover .sm-catalog__fig{transform:translate(-8px,-8px) scale(1.08)}
.sm-catalog .sm-catalog__go{position:absolute;z-index:3;right:14px;bottom:14px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.55);color:#fff;transition:background .25s ease,color .25s ease,transform .25s ease}
.sm-catalog a.sm-catalog__tile:hover .sm-catalog__go{background:#fff;color:var(--sm-teal-dark);transform:translateX(2px)}
@keyframes sm-cat-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:1099px){.sm-catalog .sm-catalog__grid{grid-template-columns:repeat(3,minmax(0,1fr))}.sm-catalog a.sm-catalog__tile{height:180px}}
@media (max-width:639px){.sm-catalog .sm-catalog__grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.sm-catalog a.sm-catalog__tile{height:160px;padding:14px 14px 0}
  .sm-catalog h2.sm-catalog__title{font-size:22px}.sm-catalog .sm-catalog__name{font-size:16px}.sm-catalog .sm-catalog__go{width:34px;height:34px;right:12px;bottom:12px}}
@media (prefers-reduced-motion:reduce){.sm-catalog a.sm-catalog__tile{animation:none;opacity:1;transition:none}.sm-catalog .sm-catalog__fig,.sm-catalog .sm-catalog__go{transition:none}.sm-catalog a.sm-catalog__tile:hover .sm-catalog__fig{transform:none}}
</style>
