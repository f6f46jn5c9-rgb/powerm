!important}}.dbv-nav .dbv-ab{border-bottom:1.5px dotted var(--dbv-teal);cursor:help;color:inherit;text-decoration:none}.dbv-nav .dbv-tip{position:absolute;left:0;top:0;z-index:20;width:max-content;max-width:300px;padding:10px 14px;border-radius:12px;background:#fff;border:1px solid rgba(0,168,192,.35);box-shadow:0 10px 30px rgba(0,120,144,.26);font:400 14px/1.4 var(--dbv-font);color:var(--dbv-ink);text-align:left;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .15s ease}.dbv-nav .dbv-tip.is-open{visibility:visible;opacity:1}.dbv-nav .dbv-tip__t{font-weight:700;color:var(--dbv-teal);margin-bottom:2px}.dbv-nav .dbv-tip::after{content:"";position:absolute;left:var(--ax,20px);bottom:-6px;width:10px;height:10px;margin-left:-5px;background:#fff;border-right:1px solid rgba(0,168,192,.35);border-bottom:1px solid rgba(0,168,192,.35);transform:rotate(45deg)}.dbv-nav .dbv-tip.is-below::after{bottom:auto;top:-6px;border:0;border-left:1px solid rgba(0,168,192,.35);border-top:1px solid rgba(0,168,192,.35)}.dbv-nav .dbv-nav__bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.dbv-nav .dbv-nav__sep{width:1px;height:26px;background:rgba(0,120,144,.3);margin:0 2px}.dbv-nav .dbv-pill{display:inline-flex;align-items:center;gap:8px;padding:9px 16px !important;margin:0 !important;border-radius:999px;border:1.5px solid rgba(0,120,144,.3);background:linear-gradient(135deg,#fff,var(--dbv-tint-cyan));box-shadow:0 3px 12px rgba(0,120,144,.08);font:600 14px/1.3 var(--dbv-font) !important;color:var(--dbv-ink) !important;text-decoration:none !important;transition:transform .2s ease,box-shadow .25s ease}.dbv-nav .dbv-pill .dbv-svg{width:18px !important;height:18px !important;color:var(--dbv-teal)}.dbv-nav a.dbv-pill,.dbv-nav a.dbv-pill:visited,.dbv-nav a.dbv-pill:hover,.dbv-nav a.dbv-pill:focus,.dbv-nav a.dbv-pill:active{color:var(--dbv-ink) !important;text-decoration:none !important}.dbv-nav a.dbv-pill:hover{transform:translateY(-2px);box-shadow:var(--dbv-shadow-hover)}.dbv-nav .dbv-pill--cur,.dbv-nav span.dbv-pill--cur{background:var(--dbv-teal);border-color:var(--dbv-teal);color:#fff !important;box-shadow:var(--dbv-shadow)}.dbv-nav .dbv-pill--off,.dbv-nav span.dbv-pill--off{background:#F4F7F8;border:1.5px dashed rgba(91,102,112,.4);box-shadow:none;color:var(--dbv-muted) !important;cursor:default}.dbv-nav .dbv-pill--off .dbv-svg{color:var(--dbv-muted)}

<div class="dbv-nav" role="region" aria-label="Страница «Роли: кто за что отвечает»"></div>
<script>
(function () {
  "use strict";
var CURRENT='grade';
var DATA = {
titleStart: 'Оценка и ',
titleAccent: 'защита',
lead: 'Оценка проводится по ходу цикла (светофор проектов, оценки участников) и по его завершении (приёмка и защита).'
};
var DBV_PAGES={
hub:{title:'Проектный трек ДБВ',url:''},
stages:{title:'Этапы и контрольные точки',url:''},
rhythm:{title:'Рабочий ритм и нештатные ситуации',url:''},
assets:{title:'Активы, КР и частые ошибки',url:''},
roles:{title:'Роли: кто за что отвечает',url:''},
grade:{title:'Оценка и защита',url:''}
};
var GLOSSARY={
};
function dbvGlossary(root){
var tip=document.createElement('div');
tip.className='dbv-tip';
tip.id='dbv-tip-'+root.className.split(' ')[0];
tip.setAttribute('role','tooltip');
var tT=document.createElement('div'),tD=document.createElement('div');
tT.className='dbv-tip__t';tD.className='dbv-tip__d';
tip.appendChild(tT);tip.appendChild(tD);
root.appendChild(tip);
var cur=null,lastType='mouse';
var SKIP='button,summary,a,.dbv-ab,script,style';
function apply(scope){
var list=[].slice.call(scope.querySelectorAll('[data-gl]'));
if(scope.hasAttribute&&scope.hasAttribute('data-gl'))list.unshift(scope);
list.forEach(function(el){
if(el.parentElement&&el.parentElement.closest('[data-gl]')&&list.indexOf(el.parentElement.closest('[data-gl]'))>-1)return;
var seen={},nodes=[],w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null),n;
while((n=w.nextNode())){
if(n.parentElement&&!n.parentElement.closest(SKIP))nodes.push(n);
}
nodes.forEach(function(tn){
var s=tn.nodeValue,re=/[A-Za-zА-яЁё]+\d*/g,m,last=0,frag=null;
while((m=re.exec(s))){
var key=m[0].replace(/\d+$/,'');
if(!Object.prototype.hasOwnProperty.call(GLOSSARY,key)||seen[key])continue;
seen[key]=1;
if(!frag)frag=document.createDocumentFragment();
if(m.index>last)frag.appendChild(document.createTextNode(s.slice(last,m.index)));
var sp=document.createElement('span');
sp.className='dbv-ab';
sp.setAttribute('tabindex','0');
sp.setAttribute('role','button');
sp.setAttribute('aria-describedby',tip.id);
sp.setAttribute('aria-expanded','false');
sp.setAttribute('data-k',key);
sp.textContent=m[0];
frag.appendChild(sp);
last=m.index+m[0].length;
}
if(frag){
if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));
tn.parentNode.replaceChild(frag,tn);
}
});
});
}
function hide(){
if(cur)cur.setAttribute('aria-expanded','false');
cur=null;
tip.classList.remove('is-open');
}
function show(el){
if(cur&&cur!==el)cur.setAttribute('aria-expanded','false');
cur=el;
var k=el.getAttribute('data-k');
tT.textContent=k;
tD.textContent=GLOSSARY[k];
el.setAttribute('aria-expanded','true');
var rr=root.getBoundingClientRect(),r=el.getBoundingClientRect();
tip.style.maxWidth=Math.max(120,Math.min(300,rr.width-16))+'px';
tip.style.left='0px';tip.style.top='0px';
var tw=tip.offsetWidth,th=tip.offsetHeight;
var cx=r.left+r.width / 2-rr.left-root.clientLeft;
var left=Math.max(8,Math.min(cx-tw / 2,rr.width-tw-8));
var top=r.top-rr.top-root.clientTop-th-10,below=false;
if(top<0){below=true;top=r.bottom-rr.top-root.clientTop+10;}
tip.style.left=Math.round(left)+'px';
tip.style.top=Math.round(top)+'px';
tip.style.setProperty('--ax',Math.round(Math.max(14,Math.min(cx-left,tw-14)))+'px');
tip.classList.toggle('is-below',below);
tip.classList.add('is-open');
}
function ab(t){return t&&t.closest?t.closest('.dbv-ab'):null;}
root.addEventListener('pointerdown',function(e){lastType=e.pointerType||'mouse';},true);
root.addEventListener('keydown',function(e){
lastType='key';
var a=ab(e.target);
if(a&&(e.key==='Enter'||e.key===' ')){e.preventDefault();cur===a?hide():show(a);}
},true);
root.addEventListener('pointerover',function(e){
var a=ab(e.target);
if(a&&e.pointerType==='mouse')show(a);
});
root.addEventListener('pointerout',function(e){
var a=ab(e.target);
if(a&&e.pointerType==='mouse'&&!(e.relatedTarget&&a.contains(e.relatedTarget)))hide();
});
root.addEventListener('click',function(e){
var a=ab(e.target);
if(!a)return;
if(lastType==='touch'||lastType==='pen')cur===a?hide():show(a);
else if(cur!==a)show(a);
});
root.addEventListener('focusin',function(e){
var a=ab(e.target);
if(a&&lastType==='key')show(a);
});
root.addEventListener('focusout',function(e){
var a=ab(e.target);
if(a&&a===cur)hide();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')hide();});
document.addEventListener('pointerdown',function(e){if(!ab(e.target))hide();});
window.addEventListener('resize',hide);
return{apply:apply,hide:hide};
}
var NAV_ITEMS=[
['stages','Этапы и КТ'],
['rhythm','Рабочий ритм и нештатные ситуации'],
['assets','Активы, КР и ошибки'],
['roles','Роли'],
['grade','Оценка и защита']
];
function dbvNav(host,current){
function e(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pill(key,label,icon){
var p=DBV_PAGES[key],inner=(icon?'<svg class="dbv-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>':'')+'<span>'+e(label)+'</span>';
if(key===current)return '<span class="dbv-pill dbv-pill--cur" aria-current="page">'+inner+'</span>';
if(!p.url)return '<span class="dbv-pill dbv-pill--off" aria-disabled="true">'+inner+'</span>';
return '<a class="dbv-pill" href="'+e(p.url)+'" rel="noopener">'+inner+'</a>';
}
host.innerHTML=pill('hub',DBV_PAGES.hub.title,true)+'<span class="dbv-nav__sep" aria-hidden="true"></span>'+
NAV_ITEMS.map(function(n){return pill(n[0],n[1]);}).join('');
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function init(root){
root.innerHTML='<div class="dbv-nav__bar"></div>'+
'<div class="dbv-nav__head"><div class="dbv-nav__clip" aria-hidden="true"><svg class="dbv-nav__orb" viewBox="0 0 240 180" preserveAspectRatio="xMaxYMin meet" focusable="false">'+
'<ellipse cx="150" cy="90" rx="118" ry="44" transform="rotate(-24 150 90)" fill="none" stroke="#007890" stroke-width="1.5" opacity=".35"/>'+
'<ellipse cx="160" cy="96" rx="96" ry="34" transform="rotate(18 160 96)" fill="none" stroke="#E01828" stroke-width="1.5" opacity=".3"/></svg></div>'+
'<div class="dbv-nav__txt"><h2 class="dbv-h2 dbv-nav__h2">'+esc(DATA.titleStart)+'<span class="dbv-nav__acc">'+esc(DATA.titleAccent)+'</span></h2>'+
'<p class="dbv-body dbv-nav__lead" data-gl>'+esc(DATA.lead)+'</p></div></div>';
dbvNav(root.querySelector('.dbv-nav__bar'),CURRENT);
dbvGlossary(root).apply(root);
}
[].forEach.call(document.querySelectorAll('.dbv-nav'),function(r){
if(r.getAttribute('data-dbv-init'))return;
r.setAttribute('data-dbv-init','1');
init(r);
});
})();
</script>
