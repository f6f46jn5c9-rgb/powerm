.ssbyt-hub .ssbyt-hub-tile__glass{position:absolute;z-index:1;inset:0;display:block;overflow:hidden;margin:0 !important;padding:0 !important;border-radius:inherit;pointer-events:none;background:linear-gradient(0deg,rgba(6,4,6,.88) 0,rgba(6,4,6,.5) 48%,rgba(6,4,6,0) 90%),linear-gradient(rgba(255,255,255,.08),rgba(255,255,255,.08)) !important;-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);border:1px solid rgba(255,255,255,.45) !important;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 26px rgba(255,255,255,.14);transition:border-color .25s ease}
