<div class="dbv-prin" role="region" aria-label="Три принципа"></div>
<script>
(function () {
  "use strict";
  /* Здесь правятся три принципа и красная плашка под ними. Меняйте только текст между кавычками; поле icon (key, ruler, star) не трогайте. Адрес кнопки «Инструкция по работе в ПЗ» берётся из src/core/dbv-pages.js (DBV_PAGES.pz.url); пока пусто — кнопка не показывается. */
  var DATA = {
    title: 'Три принципа проектного трека',
    cards: [
      { icon: 'key', title: 'Результат — инструмент', variant: 'alt',
        text: 'Результатом проекта является инструмент, а не набор мероприятий. После завершения работы команды в подразделении остаётся то, что можно применять: регламент, СОП, модель, дашборд, обучающая программа, ЛНА.' },
      { icon: 'ruler', title: 'Эффект подтверждён замером', variant: 'alt',
        text: 'Эффект проекта подтверждается исходным замером. По каждому ключевому результату (КР) фиксируется исходное значение: число, период измерения, источник данных.' },
      { icon: 'star', title: 'Единый источник данных — ПЗ', variant: 'accent',
        text: 'Единственный источник данных о проектах — система «Полярная звезда» (ПЗ).', link: 'Инструкция по работе в ПЗ →' }
    ],
    stop: 'Информация, не зафиксированная в ПЗ, для жюри и организаторов программы не существует: при оценке состояния проекта она не учитывается.'
  };
  /* Здесь живут адреса всех страниц инструкции. Впишите адрес в url — и он подставится во все блоки при следующей сборке */
  var DBV_PAGES = {
    pz:     { title: 'Инструкция по работе в ПЗ', url: 'https://kb.severstal.com/spaces/BSS/pages/581828637/%D0%94%D0%91%D0%92+%D0%9F%D1%80%D0%BE%D0%B5%D0%BA%D1%82%D0%BD%D1%8B%D0%B9+%D1%82%D1%80%D0%B5%D0%BA+%D0%98%D0%BD%D1%81%D1%82%D1%80%D1%83%D0%BA%D1%86%D0%B8%D1%8F+%D0%BF%D0%BE+%D1%81%D0%B8%D1%81%D1%82%D0%B5%D0%BC%D0%B5+%D0%9F%D0%BE%D0%BB%D1%8F%D1%80%D0%BD%D0%B0%D1%8F+%D0%B7%D0%B2%D0%B5%D0%B7%D0%B4%D0%B0' }
  };
  /* Модуль подсказок-аббревиатур (общий, копируется в каждый блок, где есть data-gl). Словарь — GLOSSARY. */
  var GLOSSARY = {
    'КТ': 'контрольная точка: момент, когда принимается решение, можно ли проекту переходить на следующий этап.',
    'ЛПР': 'лицо, принимающее решение по контрольной точке: комиссия по портфелю, координатор проектного трека, заказчик проекта или ЛСП.',
    'СОП': 'стандартная операционная процедура.',
    'ЛНА': 'локальный нормативный акт.',
    'КР': 'ключевой результат: проверяемое состояние, по которому видно, что цель проекта достигнута. У каждого КР есть показатель, исходное и целевое значение, плановая дата.',
    'ПЗ': 'система управления проектами «Полярная звезда».',
    'РП': 'руководитель проекта: член проектной команды, которого выбрала команда.',
    'ЛСП': 'лидер стратегического приоритета: руководитель, отвечающий за цели приоритета и проекты программы по нему.',
    'ДРП': 'Дирекция по работе с персоналом; организатор академического трека.',
    'ЦРБС': 'Центр развития бизнес-системы; организатор проектного трека.',
    'ГД': 'генеральный директор «Силовых машин».',
    'ДИТ': 'Дирекция по информационным технологиям.',
    'ДОБ': 'Дирекция по обеспечению безопасности.',
    'БП': 'бизнес-партнёр стратегического приоритета.'
  };

  /* Оборачивает первое вхождение каждой аббревиатуры в каждом [data-gl] и показывает подсказку. Возвращает {apply, hide}. */
  function dbvGlossary(root) {
    var tip = document.createElement('div');
    tip.className = 'dbv-tip';
    tip.id = 'dbv-tip-' + root.className.split(' ')[0];
    tip.setAttribute('role', 'tooltip');
    var tT = document.createElement('div'), tD = document.createElement('div');
    tT.className = 'dbv-tip__t'; tD.className = 'dbv-tip__d';
    tip.appendChild(tT); tip.appendChild(tD);
    root.appendChild(tip);
    var cur = null, lastType = 'mouse';
    var SKIP = 'button,summary,a,.dbv-ab,script,style';

    function apply(scope) {
      var list = [].slice.call(scope.querySelectorAll('[data-gl]'));
      if (scope.hasAttribute && scope.hasAttribute('data-gl')) list.unshift(scope);
      list.forEach(function (el) {
        if (el.parentElement && el.parentElement.closest('[data-gl]') && list.indexOf(el.parentElement.closest('[data-gl]')) > -1) return;
        var seen = {}, nodes = [], w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null), n;
        while ((n = w.nextNode())) {
          if (n.parentElement && !n.parentElement.closest(SKIP)) nodes.push(n);
        }
        nodes.forEach(function (tn) {
          var s = tn.nodeValue, re = /[A-Za-zА-яЁё]+\d*/g, m, last = 0, frag = null;
          while ((m = re.exec(s))) {
            var key = m[0].replace(/\d+$/, '');
            if (!Object.prototype.hasOwnProperty.call(GLOSSARY, key) || seen[key]) continue;
            seen[key] = 1;
            if (!frag) frag = document.createDocumentFragment();
            if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
            var sp = document.createElement('span');
            sp.className = 'dbv-ab';
            sp.setAttribute('tabindex', '0');
            sp.setAttribute('role', 'button');
            sp.setAttribute('aria-describedby', tip.id);
            sp.setAttribute('aria-expanded', 'false');
            sp.setAttribute('data-k', key);
            sp.textContent = m[0];
            frag.appendChild(sp);
            last = m.index + m[0].length;
          }
          if (frag) {
            if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
            tn.parentNode.replaceChild(frag, tn);
          }
        });
      });
    }

    function hide() {
      if (cur) cur.setAttribute('aria-expanded', 'false');
      cur = null;
      tip.classList.remove('is-open');
    }

    function show(el) {
      if (cur && cur !== el) cur.setAttribute('aria-expanded', 'false');
      cur = el;
      var k = el.getAttribute('data-k');
      tT.textContent = k;
      tD.textContent = GLOSSARY[k];
      el.setAttribute('aria-expanded', 'true');
      var rr = root.getBoundingClientRect(), r = el.getBoundingClientRect();
      tip.style.maxWidth = Math.max(120, Math.min(300, rr.width - 16)) + 'px';
      tip.style.left = '0px'; tip.style.top = '0px';
      var tw = tip.offsetWidth, th = tip.offsetHeight;
      var cx = r.left + r.width / 2 - rr.left - root.clientLeft;
      var left = Math.max(8, Math.min(cx - tw / 2, rr.width - tw - 8));
      var top = r.top - rr.top - root.clientTop - th - 10, below = false;
      if (top < 0) { below = true; top = r.bottom - rr.top - root.clientTop + 10; }
      tip.style.left = Math.round(left) + 'px';
      tip.style.top = Math.round(top) + 'px';
      tip.style.setProperty('--ax', Math.round(Math.max(14, Math.min(cx - left, tw - 14))) + 'px');
      tip.classList.toggle('is-below', below);
      tip.classList.add('is-open');
    }

    function ab(t) { return t && t.closest ? t.closest('.dbv-ab') : null; }
    root.addEventListener('pointerdown', function (e) { lastType = e.pointerType || 'mouse'; }, true);
    root.addEventListener('keydown', function (e) {
      lastType = 'key';
      var a = ab(e.target);
      if (a && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); cur === a ? hide() : show(a); }
    }, true);
    root.addEventListener('pointerover', function (e) {
      var a = ab(e.target);
      if (a && e.pointerType === 'mouse') show(a);
    });
    root.addEventListener('pointerout', function (e) {
      var a = ab(e.target);
      if (a && e.pointerType === 'mouse' && !(e.relatedTarget && a.contains(e.relatedTarget))) hide();
    });
    root.addEventListener('click', function (e) {
      var a = ab(e.target);
      if (!a) return;
      if (lastType === 'touch' || lastType === 'pen') cur === a ? hide() : show(a);
      else if (cur !== a) show(a);
    });
    root.addEventListener('focusin', function (e) {
      var a = ab(e.target);
      if (a && lastType === 'key') show(a);
    });
    root.addEventListener('focusout', function (e) {
      var a = ab(e.target);
      if (a && a === cur) hide();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hide(); });
    document.addEventListener('pointerdown', function (e) { if (!ab(e.target)) hide(); });
    window.addEventListener('resize', hide);
    return { apply: apply, hide: hide };
  }
  var ICONS = {
    key: '<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 20 3M16 7l3 3M13.5 9.5l2.5 2.5"/>',
    ruler: '<rect x="2" y="7" width="20" height="10" rx="2"/><path d="M6 7v4M10 7v3M14 7v4M18 7v3"/>',
    star: '<path d="M12 2c.6 5.2 4.8 9.4 10 10-5.2.6-9.4 4.8-10 10-.6-5.2-4.8-9.4-10-10 5.2-.6 9.4-4.8 10-10z"/>',
    diamond: '<path d="M12 2.5 21.5 12 12 21.5 2.5 12z"/><path d="M12 8v5M12 16v.5"/>'
  };
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function svg(n) { return '<svg class="dbv-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + ICONS[n] + '</svg>'; }
  function init(root) {
    root.innerHTML =
      '<h2 class="dbv-h2">' + esc(DATA.title) + '</h2>' +
      '<div class="dbv-prin__grid">' + DATA.cards.map(function (c, i) {
        return '<div class="dbv-glass dbv-lift dbv-prin__card' + (c.variant === 'accent' ? ' dbv-glass--accent' : '') + '" style="--i:' + i + '">' +
          '<div class="dbv-prin__top"><span class="dbv-prin__num" aria-hidden="true">' + (i + 1) + '</span><span class="dbv-ico dbv-prin__ico">' + svg(c.icon) + '</span></div>' +
          '<h3 class="dbv-h3 dbv-prin__t">' + esc(c.title) + '</h3>' +
          '<p class="dbv-body dbv-prin__txt" data-gl>' + esc(c.text) + '</p>' +
          (c.link && DBV_PAGES.pz.url ? '<a class="dbv-go" href="' + esc(DBV_PAGES.pz.url) + '" rel="noopener">' + esc(c.link) + '</a>' : '') + '</div>';
      }).join('') + '</div>' +
      '<div class="dbv-stop" role="note"><span aria-hidden="true">' + svg('diamond') + '</span><p class="dbv-body" data-gl>' + esc(DATA.stop) + '</p></div>';
    dbvGlossary(root).apply(root);
  }
  [].forEach.call(document.querySelectorAll('.dbv-prin'), function (r) {
    if (r.getAttribute('data-dbv-init')) return;
    r.setAttribute('data-dbv-init', '1');
    init(r);
  });
})();
</script>
