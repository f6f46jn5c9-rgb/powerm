.dbv-crit p.dbv-crit__lead{max-width:860px}.dbv-crit .dbv-cl{display:flex;flex-direction:column;gap:16px;margin-top:20px}.dbv-crit .dbv-cc{padding:18px 22px 20px !important;min-width:0}.dbv-crit .dbv-cc__top{position:relative;display:flex;align-items:center;gap:14px}.dbv-crit .dbv-cc__n{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--dbv-teal);color:#fff;font:700 16px/1 var(--dbv-font)}.dbv-crit p.dbv-cc__d{position:relative;margin:12px 0 0 !important}.dbv-crit p.dbv-cq{position:relative;margin:12px 0 0 !important;padding:10px 14px !important;border-left:4px solid var(--dbv-red);border-radius:10px;background:var(--dbv-tint-red);font:400 15px/1.45 var(--dbv-font) !important;color:var(--dbv-ink) !important}.dbv-crit .dbv-cq b{font-weight:700;color:var(--dbv-red-ink);margin-right:.3em}.dbv-crit .dbv-rg{position:relative;display:inline-flex;flex-wrap:wrap;gap:8px;margin-top:14px}.dbv-crit .dbv-rb{appearance:none;margin:0 !important;padding:9px 18px !important;border:1.5px solid rgba(0,120,144,.35);border-radius:999px;background:#fff !important;cursor:pointer;font:600 14px/1.3 var(--dbv-font) !important;color:var(--dbv-ink) !important;transition:background .2s,border-color .2s,box-shadow .2s}.dbv-crit .dbv-rb:hover{box-shadow:0 3px 12px rgba(0,120,144,.2);border-color:var(--dbv-teal)}.dbv-crit .dbv-rb[aria-checked="true"].dbv-rb--y{background:var(--dbv-teal) !important;border-color:var(--dbv-teal);color:#fff !important}.dbv-crit .dbv-rb[aria-checked="true"].dbv-rb--n{background:var(--dbv-tint-red) !important;border-color:var(--dbv-red);border-width:2px;padding:8.5px 17.5px !important;color:var(--dbv-red-ink) !important}.dbv-crit .dbv-vd{margin-top:22px;padding:18px 22px !important;border-radius:var(--dbv-radius);background:#fff;border:1.5px solid rgba(0,120,144,.3);box-shadow:var(--dbv-shadow)}.dbv-crit p.dbv-vd__rule{margin:0 0 10px !important}.dbv-crit .dbv-vd__row{display:flex;flex-wrap:wra <div class="dbv-crit" role="region" aria-label="Критерии включения проекта"></div>
<script>
(function () {
  "use strict";
var DATA = {
title: 'Проверьте проект по пяти критериям',
lead: 'Пять критериев включения проекта в портфель (КТ1). Те же критерии применяются повторно при любом изменении темы, цели и границ проекта. Отметьте, выполняется ли каждый критерий для вашего проекта: ниже появится вывод. Это самопроверка; решение принимает комиссия по портфелю.',
criteria: [
{ title: 'Формат программы', d: 'Остаётся управленческий инструмент: процесс, оргмодель, инфраструктура, регламент, СОП, модель, дашборд.', no: 'проект — разовая задача, актуализация документа или мероприятие; это текущая операционная деятельность.' },
{ title: 'Измеримость', d: 'Есть показатель и его исходное значение (период, источник) либо способ его получить.', no: 'показателя нет; результат подтверждается только выпуском документов.' },
{ title: 'Реалистичный объём', d: 'Определён минимальный объём внедрения: одно подразделение, один процесс или одна группа номенклатуры.', no: 'несколько несвязанных направлений; минимальный объём не определён.' },
{ title: 'Устойчивость', d: 'Известно, кто примет результат после проекта.', no: 'владелец результата не определён или не подтвердил готовность.' },
{ title: 'Заказ подтверждён, дублей нет', d: 'Заказчик подтвердил проблему и цель, готов работать с командой.', no: 'заказчика нет или он не подтвердил формулировку; проект дублирует другой.' }
],
labels: { no: 'Проект не проходит, если:', yes: 'Выполняется', not: 'Не выполняется', reset: 'Сбросить ответы', group: 'Критерий' },
rule: 'Не выполнены не более двух критериев — проект вернут на переформулирование. Три и более либо критерий 1 — проект не включат.',
verdicts: {
ok: 'Все критерии выполняются: проект может быть включён в портфель (решение принимает комиссия по портфелю)',
warn: 'Проект вернут на переформулирование',
bad: 'Проект не включат'
}
};
var GLOSSARY={
'КТ':'контрольная точка: момент, когда принимается решение, можно ли проекту переходить на следующий этап.',
'СОП':'стандартная операционная процедура.'
};
function dbvGlossary(root){
var tip=document.createElement('div');
tip.className='dbv-tip';
tip.id='dbv-tip-'+root.className.split(' ')[0];
tip.setAttribute('role','tooltip');
var tT=document.createElement('div'),tD=document.createElement('div');
tT.className='dbv-tip__t';tD.className='dbv-tip__d';
tip.appendChild(tT);tip.appendChild(tD);
root.appendChild(tip);
var cur=null,lastType='mouse';
var SKIP='button,summary,a,.dbv-ab,script,style';
function apply(scope){
var list=[].slice.call(scope.querySelectorAll('[data-gl]'));
if(scope.hasAttribute&&scope.hasAttribute('data-gl'))list.unshift(scope);
list.forEach(function(el){
if(el.parentElement&&el.parentElement.closest('[data-gl]')&&list.indexOf(el.parentElement.closest('[data-gl]'))>-1)return;
var seen={},nodes=[],w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null),n;
while((n=w.nextNode())){
if(n.parentElement&&!n.parentElement.closest(SKIP))nodes.push(n);
}
nodes.forEach(function(tn){
var s=tn.nodeValue,re=/[A-Za-zА-яЁё]+\d*/g,m,last=0,frag=null;
while((m=re.exec(s))){
var key=m[0].replace(/\d+$/,'');
if(!Object.prototype.hasOwnProperty.call(GLOSSARY,key)||seen[key])continue;
seen[key]=1;
if(!frag)frag=document.createDocumentFragment();
if(m.index>last)frag.appendChild(document.createTextNode(s.slice(last,m.index)));
var sp=document.createElement('span');
sp.className='dbv-ab';
sp.setAttribute('tabindex','0');
sp.setAttribute('role','button');
sp.setAttribute('aria-describedby',tip.id);
sp.setAttribute('aria-expanded','false');
sp.setAttribute('data-k',key);
sp.textContent=m[0];
frag.appendChild(sp);
last=m.index+m[0].length;
}
if(frag){
if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));
tn.parentNode.replaceChild(frag,tn);
}
});
});
}
function hide(){
if(cur)cur.setAttribute('aria-expanded','false');
cur=null;
tip.classList.remove('is-open');
}
function show(el){
if(cur&&cur!==el)cur.setAttribute('aria-expanded','false');
cur=el;
var k=el.getAttribute('data-k');
tT.textContent=k;
tD.textContent=GLOSSARY[k];
el.setAttribute('aria-expanded','true');
var rr=root.getBoundingClientRect(),r=el.getBoundingClientRect();
tip.style.maxWidth=Math.max(120,Math.min(300,rr.width-16))+'px';
tip.style.left='0px';tip.style.top='0px';
var tw=tip.offsetWidth,th=tip.offsetHeight;
var cx=r.left+r.width / 2-rr.left-root.clientLeft;
var left=Math.max(8,Math.min(cx-tw / 2,rr.width-tw-8));
var top=r.top-rr.top-root.clientTop-th-10,below=false;
if(top<0){below=true;top=r.bottom-rr.top-root.clientTop+10;}
tip.style.left=Math.round(left)+'px';
tip.style.top=Math.round(top)+'px';
tip.style.setProperty('--ax',Math.round(Math.max(14,Math.min(cx-left,tw-14)))+'px');
tip.classList.toggle('is-below',below);
tip.classList.add('is-open');
}
function ab(t){return t&&t.closest?t.closest('.dbv-ab'):null;}
root.addEventListener('pointerdown',function(e){lastType=e.pointerType||'mouse';},true);
root.addEventListener('keydown',function(e){
lastType='key';
var a=ab(e.target);
if(a&&(e.key==='Enter'||e.key===' ')){e.preventDefault();cur===a?hide():show(a);}
},true);
root.addEventListener('pointerover',function(e){
var a=ab(e.target);
if(a&&e.pointerType==='mouse')show(a);
});
root.addEventListener('pointerout',function(e){
var a=ab(e.target);
if(a&&e.pointerType==='mouse'&&!(e.relatedTarget&&a.contains(e.relatedTarget)))hide();
});
root.addEventListener('click',function(e){
var a=ab(e.target);
if(!a)return;
if(lastType==='touch'||lastType==='pen')cur===a?hide():show(a);
else if(cur!==a)show(a);
});
root.addEventListener('focusin',function(e){
var a=ab(e.target);
if(a&&lastType==='key')show(a);
});
root.addEventListener('focusout',function(e){
var a=ab(e.target);
if(a&&a===cur)hide();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')hide();});
document.addEventListener('pointerdown',function(e){if(!ab(e.target))hide();});
window.addEventListener('resize',hide);
return{apply:apply,hide:hide};
}
var IC={
chk:'<circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.5l3 3 6-6.5"/>',
warn:'<path d="M12 2.5 21.5 12 12 21.5 2.5 12z"/><path d="M12 8v5M12 16v.5"/>',
reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>'
};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function svg(n){return '<svg class="dbv-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+IC[n]+'</svg>';}
function init(root){
var C=DATA.criteria,L=DATA.labels,ans=C.map(function(){return null;});
root.innerHTML='<h2 class="dbv-h2" id="dbv-criteria">'+esc(DATA.title)+'</h2><p class="dbv-body dbv-crit__lead" data-gl>'+esc(DATA.lead)+'</p>'+
'<div class="dbv-cl">'+C.map(function(c,i){
return '<div class="dbv-cc dbv-glass" style="--i:'+i+'"><div class="dbv-cc__top"><span class="dbv-cc__n" aria-hidden="true">'+(i+1)+'</span><h3 class="dbv-h3">'+esc(c.title)+'</h3></div>'+
'<p class="dbv-body dbv-cc__d" data-gl>'+esc(c.d)+'</p><p class="dbv-cq" data-gl><b>'+esc(L.no)+'</b>'+esc(c.no)+'</p>'+
'<div class="dbv-rg" role="radiogroup" aria-label="'+esc(L.group+' '+(i+1)+': '+c.title)+'" data-i="'+i+'">'+
'<button type="button" class="dbv-rb dbv-rb--y" role="radio" aria-checked="false" data-v="1" tabindex="0">'+esc(L.yes)+'</button>'+
'<button type="button" class="dbv-rb dbv-rb--n" role="radio" aria-checked="false" data-v="0" tabindex="-1">'+esc(L.not)+'</button></div></div>';
}).join('')+'</div>'+
'<div class="dbv-vd"><p class="dbv-small dbv-vd__rule" data-gl>'+esc(DATA.rule)+'</p>'+
'<div class="dbv-vd__row"><div class="dbv-vd__cnt" data-cnt></div><button type="button" class="dbv-btn" data-reset>'+svg('reset')+esc(L.reset)+'</button></div>'+
'<div class="dbv-vd__r" aria-live="polite" data-res></div></div>';
dbvGlossary(root).apply(root);
var groups=[].slice.call(root.querySelectorAll('.dbv-rg')),cnt=root.querySelector('[data-cnt]'),res=root.querySelector('[data-res]');
function verdict(){
var n=ans.filter(function(a){return a!==null;}).length,m=ans.filter(function(a){return a===false;}).length;
cnt.textContent='Отмечено: '+n+' из '+C.length+' · не выполняется: '+m;
var cls='',txt='',ic='';
if(n===C.length){
if(m===0){cls='ok';txt=DATA.verdicts.ok;ic='chk';}
else if(m>=3||ans[0]===false){cls='bad';txt=DATA.verdicts.bad;ic='warn';}
else{cls='warn';txt=DATA.verdicts.warn;ic='warn';}
}
res.innerHTML=cls?'<div class="dbv-vd__m dbv-vd__m--'+cls+'">'+svg(ic)+'<span>'+esc(txt)+'</span></div>':'';
res.setAttribute('data-verdict',cls);
}
function paint(){
groups.forEach(function(g,i){
var bs=g.querySelectorAll('.dbv-rb');
[].forEach.call(bs,function(b,k){
var v=b.getAttribute('data-v')==='1',on=ans[i]===v;
b.setAttribute('aria-checked',on?'true':'false');
b.tabIndex=ans[i]===null?(k===0?0:-1):(on?0:-1);
});
});
verdict();
}
function set(g,v,focus){
var i=+g.getAttribute('data-i');
ans[i]=v;
paint();
if(focus)g.querySelector('[data-v="'+(v?1:0)+'"]').focus();
}
root.addEventListener('click',function(e){
var b=e.target.closest&&e.target.closest('.dbv-rb');
if(b){set(b.parentNode,b.getAttribute('data-v')==='1',false);return;}
if(e.target.closest&&e.target.closest('[data-reset]')){ans=C.map(function(){return null;});paint();}
});
root.addEventListener('keydown',function(e){
var b=e.target.closest&&e.target.closest('.dbv-rb');
if(!b)return;
var v=b.getAttribute('data-v')==='1';
if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();set(b.parentNode,!v,true);}
else if(e.key===' '||e.key==='Enter'){e.preventDefault();set(b.parentNode,v,false);}
});
paint();
}
[].forEach.call(document.querySelectorAll('.dbv-crit'),function(r){
if(r.getAttribute('data-dbv-init'))return;
r.setAttribute('data-dbv-init','1');
init(r);
});
})();
</script>
