<style>
.prk-header{--prk-navy:#1a2a5e;--prk-teal:#0e7c7b;--prk-muted-dark:#a8c5c4;--prk-tint:#e6f4f3;--prk-line:#E3EAED;
  --prk-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:block;position:relative;container-type:inline-size;box-sizing:border-box;width:100%;max-width:100%;margin:0;padding:0;
  font:400 16px/1.4 var(--prk-font);text-align:left;word-break:normal;overflow-wrap:normal;hyphens:manual;-webkit-text-size-adjust:100%}
.prk-header *,.prk-header *::before,.prk-header *::after{box-sizing:border-box}
.prk-header .prk-bar{display:block !important;height:3px !important;margin:0 !important;padding:0 !important;background:var(--prk-teal) !important}
.prk-header .prk-panel{display:flex !important;align-items:center !important;justify-content:space-between !important;min-height:72px !important;margin:0 !important;padding:0 24px !important;background:var(--prk-navy) !important;border:0 !important}
.prk-header .prk-left{display:flex !important;flex-direction:row !important;align-items:center !important;margin:0 !important;padding:0 !important;min-width:0}
.prk-header .prk-badge{display:inline-block !important;margin:0 14px 0 0 !important;padding:4px 10px !important;border:0 !important;border-radius:0 !important;background:var(--prk-teal) !important;color:#fff !important;
  font:700 11px/1.3 var(--prk-font) !important;letter-spacing:0 !important;text-transform:uppercase !important;white-space:nowrap}
.prk-header .prk-text{display:block !important;margin:0 !important;padding:0 !important;color:var(--prk-muted-dark) !important;font:400 13px/1.4 var(--prk-font) !important;letter-spacing:0 !important;text-transform:none !important}
.prk-header .prk-mark{display:block !important;margin:0 0 0 16px !important;padding:0 !important;color:var(--prk-tint) !important;opacity:.25;font:700 22px/1.2 var(--prk-font) !important;letter-spacing:0 !important;white-space:nowrap;user-select:none}
.prk-header .prk-rule{display:block !important;height:1px !important;margin:0 !important;padding:0 !important;background:var(--prk-line) !important}
@container (max-width:560px){
  .prk-header .prk-panel{min-height:0 !important;height:auto !important;padding:12px 16px !important}
  .prk-header .prk-left{flex-direction:column !important;align-items:flex-start !important;gap:6px}
  .prk-header .prk-badge{margin:0 !important}
  .prk-header .prk-mark{display:none !important}
}
</style>
<div class="prk-header">
  <div class="prk-bar"></div>
  <div class="prk-panel">
    <div class="prk-left">
      <span class="prk-badge">Лучшая практика</span>
      <span class="prk-text">Бизнес-система · Силовые машины</span>
    </div>
    <div class="prk-mark" aria-hidden="true">БС СМ</div>
  </div>
  <div class="prk-rule"></div>
</div>
