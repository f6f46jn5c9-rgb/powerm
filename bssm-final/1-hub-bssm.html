<style>

.bssm-hub .bssm-hero{position:relative;display:block;margin:0 0 20px !important;padding:28px 32px !important;border:0 !important;border-radius:12px;background:linear-gradient(135deg,#071020 0%,#0c1e3e 35%,#172f6a 65%,#2a5ca8 100%) !important}

.bssm-hub h1.bssm-hero__title{margin:0 0 6px !important;padding:0 !important;border:0 !important;background:none !important;font-size:28px !important;font-weight:800 !important;line-height:1.15 !important;color:#fff !important;font-family:inherit !important;letter-spacing:0 !important;text-transform:none !important;text-decoration:none !important;font-style:normal !important;text-align:left !important;text-wrap:balance}

.bssm-hub .bssm-tile__top{position:relative;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin:0 !important;padding:0 !important;border:0 !important;background:none !important;}

.bssm-hub .bssm-tile__side{display:block;margin:0 !important;padding:0 !important;border:0 !important;background:none !important;}

})();
