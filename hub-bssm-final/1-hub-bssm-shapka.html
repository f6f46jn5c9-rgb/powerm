<!-- HTML-МАКРОС 1: ШАПКА -->
<style>
.bssm-hero{--bssm-accent:#2a5ca8;--bssm-accent-dark:#1e4d8c;--bssm-accent-tint:#e8edf7;--bssm-ink:#1F2A33;--bssm-muted:#5B6670;--bssm-line:#E3EAED;
  display:block;box-sizing:border-box;width:100%;max-width:100%;margin:0 0 24px !important;padding:0 !important;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4;color:var(--bssm-ink);text-align:left;word-break:normal;overflow-wrap:normal;-webkit-hyphens:manual;hyphens:manual}
.bssm-hero *,.bssm-hero *::before,.bssm-hero *::after{box-sizing:border-box}
.bssm-hero a.bssm-hero__back{display:inline-block;margin:0 0 16px !important;padding:2px 0 !important;font-size:14px !important;font-weight:400 !important;line-height:1.3 !important;color:var(--bssm-muted) !important;text-decoration:none !important;text-transform:none !important;letter-spacing:0 !important;font-style:normal !important;border:0 !important;border-radius:3px;background:none !important;transition:color .2s ease}
.bssm-hero a.bssm-hero__back:visited{color:var(--bssm-muted) !important}
.bssm-hero a.bssm-hero__back:hover{color:var(--bssm-ink) !important;text-decoration:underline !important}
.bssm-hero a.bssm-hero__back:focus-visible{outline:3px solid var(--bssm-accent-dark);outline-offset:3px}
.bssm-hero .bssm-hero__row{display:flex;align-items:center;gap:14px;margin:0 !important;padding:0 !important}
.bssm-hero .bssm-hero__ico{margin:0 !important;padding:0 !important;border:0 !important;background:none !important;flex:0 0 auto;display:block;width:48px;height:48px}
.bssm-hero .bssm-hero__ico svg{display:block;max-width:none}
.bssm-hero .bssm-hero__txt{flex:1 1 auto;min-width:0}
.bssm-hero h1.bssm-hero__title{margin:0 0 4px !important;padding:0 !important;border:0 !important;background:none !important;font-family:inherit !important;font-size:26px !important;font-weight:800 !important;line-height:1.15 !important;color:var(--bssm-ink) !important;letter-spacing:0 !important;text-transform:none !important;text-decoration:none !important;font-style:normal !important;text-align:left !important;text-wrap:balance}
.bssm-hero p.bssm-hero__sub{margin:0 !important;padding:0 !important;border:0 !important;font-size:16px !important;font-weight:400 !important;line-height:1.4 !important;color:var(--bssm-muted) !important;letter-spacing:0 !important;text-transform:none !important;text-decoration:none !important;font-style:normal !important;text-align:left !important}
.bssm-hero .bssm-hero__line{display:block;height:1px;margin:16px 0 0 !important;padding:0 !important;border:0 !important;background:var(--bssm-line) !important}
</style>
<div class="bssm-hero">
  <a class="bssm-hero__back" href="https://kb.severstal.com/spaces/BSS/" aria-label="Назад в БУП">&larr; БУП</a>
  <div class="bssm-hero__row">
    <span class="bssm-hero__ico" aria-hidden="true"><svg width="48" height="48" viewBox="0 0 48 48" fill="none" aria-hidden="true" focusable="false"><circle cx="24" cy="24" r="22" stroke="#2a5ca8" stroke-width="2.5"/><g fill="#2a5ca8"><circle cx="15" cy="15" r="2.3"/><circle cx="24" cy="15" r="2.3"/><circle cx="33" cy="15" r="2.3"/><circle cx="15" cy="24" r="2.3"/><circle cx="24" cy="24" r="2.3"/><circle cx="33" cy="24" r="2.3"/><circle cx="15" cy="33" r="2.3"/><circle cx="24" cy="33" r="2.3"/><circle cx="33" cy="33" r="2.3"/></g></svg></span>
    <div class="bssm-hero__txt">
      <h1 class="bssm-hero__title">Бизнес-система. СМ</h1>
      <p class="bssm-hero__sub">Методы, программы и практики организационного развития</p>
    </div>
  </div>
  <span class="bssm-hero__line" aria-hidden="true"></span>
</div>
