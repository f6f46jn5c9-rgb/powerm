.izm-hub a.izm-file:visited{color:#2a5ca8 !important}
.izm-hub a.izm-file:hover .izm-file__n{text-decoration:underline !important}

<script>
(function () {
  var links = document.querySelectorAll('.izm-hub .izm-crumb a');
  for (var i = 0; i < links.length; i++) {
