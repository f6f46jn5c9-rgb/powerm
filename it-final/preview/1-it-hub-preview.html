<script>
(function () {
  var tiles = document.querySelectorAll('.it-hub a.it-hub-tile');
  for (var i = 0; i < tiles.length; i++) {
    var t = tiles[i];
    if (!(t.getAttribute('href') || '').replace(/\s/g, '')) {
      t.setAttribute('data-soon', 'true');
      t.setAttribute('aria-disabled', 'true');
      t.setAttribute('tabindex', '-1');
      var s = document.createElement('span');
      s.className = 'it-soon';
      s.textContent = 'Скоро';
      t.appendChild(s);
    }
  }
})();
</script>
